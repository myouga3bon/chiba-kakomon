<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>千葉県公立高校入試 過去問</title>
<style>
:root{--ink:#33304a;--bg:#fffdf7}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg) radial-gradient(circle at 12px 12px,#ffe9f1 3px,transparent 4px) 0 0/48px 48px;color:var(--ink);line-height:1.6}
header{padding:8px 10px;text-align:center;background:linear-gradient(120deg,#ffd6e7,#fff1b8 35%,#d4f5dc 65%,#d3e6ff);border-bottom:4px dotted #fff}
.t1{font-size:.95rem;font-weight:800;text-shadow:1px 1px 0 #fff}
h1{font-size:2rem;margin:0;letter-spacing:.05em;text-shadow:2px 2px 0 #fff}
#nav{max-width:920px;margin:8px auto 0;padding:6px 8px;background:#ffffffcc;border:3px solid #fff;border-radius:20px;box-shadow:0 4px 14px #0000001a}
.row{display:flex;flex-wrap:nowrap;gap:4px;align-items:center;margin:4px 0}
.row button{flex:1;min-width:0;white-space:nowrap;padding:5px 0;font-size:clamp(.66rem,3.2vw,.95rem)}
.lb{flex:none;font-size:clamp(.62rem,2.8vw,.78rem);font-weight:800;padding:3px 7px;border-radius:999px;color:#fff;background:#8e6bff;white-space:nowrap}
button,.pb{font:inherit;cursor:pointer;border:2.5px solid var(--bc,#cbbaff);background:var(--bg0,#fff);color:var(--tx,#33304a);border-radius:999px;padding:6px 13px;font-weight:800;box-shadow:0 3px 0 var(--bc,#cbbaff);transition:transform .12s;text-decoration:none;display:inline-block}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bc,#cbbaff)}
button.on{background:var(--bs,#8e6bff);border-color:var(--bs,#8e6bff);color:var(--ts,#fff);box-shadow:0 3px 0 var(--bd,#6a48d8)}
.Y{--bg0:#ece5ff;--bc:#cbbaff;--tx:#5a3fb0;--bs:#8e6bff;--bd:#6a48d8}
.math{--bg0:#dcecff;--bc:#b3d4fb;--tx:#1d4f8f;--bs:#5aa5f5;--bd:#3a86d6;--acc:#5aa5f5;--accl:#dcecff;--acct:#1d4f8f}
.english{--bg0:#ffdfec;--bc:#ffb9d4;--tx:#a22a63;--bs:#f06fa4;--bd:#cf4a85;--acc:#f06fa4;--accl:#ffdfec;--acct:#a22a63}
.science{--bg0:#fff4b8;--bc:#ffe36e;--tx:#7a5d00;--bs:#f7cf2a;--bd:#d1a900;--ts:#5b4500;--acc:#f7cf2a;--accl:#fff4b8;--acct:#7a5d00}
.social{--bg0:#daf5dd;--bc:#a9e5b2;--tx:#25692f;--bs:#4cb866;--bd:#2f9449;--acc:#4cb866;--accl:#daf5dd;--acct:#25692f}
.japanese{--bg0:#ffe4cc;--bc:#ffc999;--tx:#9a4d0b;--bs:#f59a3c;--bd:#d27a1c;--acc:#f59a3c;--accl:#ffe4cc;--acct:#9a4d0b}
.ctl{--bg0:#dcecff;--bc:#b3d4fb;--tx:#1d4f8f;--bs:#5aa5f5;--bd:#3a86d6}
.xb{--bg0:#fff;--bc:#cfc8e6;--tx:#5a5280}
.hi{--bg0:#fff4b8;--bc:#f2c200;--tx:#7a5d00}
#pdfrow{text-align:center;margin:6px 0 2px;display:none}
#pdfrow .pb{font-size:.85rem;padding:4px 14px;--bg0:#fff;--bc:#8db9f5;--tx:#1f6fe0}
#msg{text-align:center;color:#888;padding:18px}
#rd{display:none;height:100vh;height:100dvh;flex-direction:column;background:#fff;border-top:4px solid var(--acc)}
#bar{display:flex;flex-wrap:nowrap;gap:4px;align-items:center;padding:4px 6px;background:var(--accl)}
#bar button{flex:1;min-width:0;white-space:nowrap;padding:5px 1px;font-size:clamp(.64rem,3.2vw,.9rem);box-shadow:0 2px 0 var(--bc,#cbbaff)}
#pg{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:#eceaf2}
#col{flex:1;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch}
#col .pw{max-width:900px;margin:0 auto 12px}
#col img{display:block;width:100%;background:#fff;border:1px solid #ccc}
.pn,#tt{text-align:center;font-size:.78rem;color:#777;margin:2px 0}
.end{text-align:center;padding:16px 0 40px}
.end button{font-size:1.05rem;padding:9px 24px}
#sp{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center;padding:6px 6px 0}
.sl{flex:0 1 50%;min-width:0;display:flex;align-items:center}
.sl.L{justify-content:flex-end}.sl.R{justify-content:flex-start}
.sl img{max-width:100%;max-height:100%;background:#fff;border:1px solid #ccc;object-fit:contain}
#pgr{display:flex;flex-direction:column;gap:3px;align-items:center;padding:4px 6px}
#pgr .r1{font-size:.78rem;font-weight:700;color:#555}
#pgr .r2{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
#pgr button{padding:4px 12px;font-size:.85rem}
#xp{display:none;background:#fff;min-height:100vh}
.xbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--accl);border-bottom:3px solid var(--acc)}
.xt{font-weight:800;color:var(--acct);font-size:.9rem}.xbar>button{white-space:nowrap;padding:4px 10px;font-size:.82rem}
.zm{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:800;color:#1d4f8f}.zm button{padding:2px 9px;font-size:.95rem}
.xin{max-width:1100px;margin:0 auto;padding:8px 12px 50px}
.xh{font-size:1.05rem;margin:18px 0 6px;color:var(--acct)}
.ai{display:block;width:calc(100% * var(--z,1));max-width:none;margin:6px auto;border:1px solid #ccc}
.aw{overflow-x:auto}
.lg{font-size:.85rem;color:#6b6585;margin:4px 0}
.note{font-size:.78rem;color:#7a7590;margin-top:20px}
@media (max-width:820px){h1{font-size:1.6rem}}
@media (orientation:landscape) and (max-height:520px){header{padding:3px}.t1{display:none}h1{font-size:1.1rem}}
</style></head><body>
<header><div class="t1">千葉県公立高校入試　学力検査（本検査）</div><h1>過去問サイト</h1></header>
<div id="nav"><div class="row" id="ry"><span class="lb">年度</span></div><div class="row" id="rb"></div>
<div id="pdfrow"><a class="pb" id="pdfa" target="_blank" rel="noopener">🖨 この年度の印刷用カコモンセット（PDF）</a></div></div>
<div id="msg">年度と教科を選んでください</div>
<section id="rd">
 <div id="bar"><button class="xb" id="bk">選択に戻る</button><button class="ctl" id="m1">1ページずつ</button><button class="ctl" id="m2">2ページずつ</button><button class="hi" id="ga">✏️ 答え</button></div>
 <div id="pg"><div id="col"></div><div id="sp" style="display:none"></div><div id="pgr" style="display:none"></div></div>
</section>
<section id="xp"></section>
<script>
const M={"2021": {"w": "令和３", "s": {"japanese": {"n": 14, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 9, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2022": {"w": "令和４", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 12, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2023": {"w": "令和５", "s": {"japanese": {"n": 18, "a": 1, "sh": 1}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2024": {"w": "令和６", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 16, "a": 1, "sh": 1}}}, "2025": {"w": "令和７", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2026": {"w": "令和８", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 17, "a": 1, "sh": 1}}}};
const SUB=[['japanese','📖国語'],['math','🔢数学'],['english','🔤英語'],['science','🔬理科'],['social','🌏社会']];
const YS=Object.keys(M).sort().reverse();
const $=i=>document.getElementById(i);
let y=null,sb=null,mode=1,sp=0,Z=1;const LD={};
function load(f){return LD[f]||(LD[f]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=f+'.js?v=2611270107';s.onload=res;s.onerror=()=>{delete LD[f];rej()};document.head.appendChild(s)}))}
YS.forEach(k=>{const b=document.createElement('button');b.className='Y';b.innerHTML=k+'<br><small>'+M[k].w.replace('令和','R')+'</small>';b.style.lineHeight='1.1';b.dataset.k=k;b.onclick=()=>pick(k,null);$('ry').appendChild(b)});
SUB.forEach(([k,l])=>{const b=document.createElement('button');b.className=k;b.textContent=l;b.dataset.k=k;b.onclick=()=>pick(null,k);$('rb').appendChild(b)});
function pick(a,b){if(a)y=a;if(b)sb=b;sp=0;$('xp').style.display='none';render(true)}
function ttl(){return M[y].w+'年度（'+y+'）'+SUB.find(x=>x[0]==sb)[1].replace(/^[^一-龠]+/,'')}
async function render(scroll){
 document.querySelectorAll('#ry button').forEach(b=>b.classList.toggle('on',b.dataset.k==y));
 document.querySelectorAll('#rb button').forEach(b=>b.classList.toggle('on',b.dataset.k==sb));
 if(y){$('pdfrow').style.display='';$('pdfa').href='chiba_kakomon_set_'+y+'.pdf';$('pdfa').textContent='🖨 '+M[y].w+'年度の印刷用カコモンセット（PDF）'}
 if(!y||!sb)return;
 const rd=$('rd');rd.style.display='flex';$('msg').style.display='none';rd.className=sb;
 const key=y+'_'+sb;$('col').innerHTML="<p id='tt'>読み込み中…</p>";$('sp').innerHTML='';
 try{await load(key)}catch(_){$('col').innerHTML='<p id="tt">読み込みに失敗しました</p>';return}
 if(key!=y+'_'+sb)return;
 $('m1').classList.toggle('on',mode==1);$('m2').classList.toggle('on',mode==2);
 draw();if(scroll)rd.scrollIntoView();
}
function P(){return IMG[y+'_'+sb]}
const ansBtn="<button class='hi' onclick='showAns()'>✏️ 正答表・解答用紙を見る</button>";
function draw(){
 const p=P(),L=p.length;
 if(mode==1){$('col').style.display='';$('sp').style.display='none';$('pgr').style.display='none';
  $('col').innerHTML="<p id='tt'>"+ttl()+"（全"+L+"ページ）</p>"+p.map((s,i)=>"<div class='pw'><p class='pn'>"+(i+1)+" / "+L+"</p><img loading='lazy' src='"+s+"'></div>").join('')+"<div class='end'>"+ansBtn+"</div>";
 }else{$('col').style.display='none';$('sp').style.display='flex';$('pgr').style.display='flex';
  const n=Math.floor(L/2)+1;sp=Math.max(0,Math.min(sp,n-1));
  let a=sp==0?-1:2*sp-1,b=sp==0?0:2*sp;if(a>=L)a=-1;if(b>=L)b=-1;
  const rtl=sb=='japanese';let l=rtl?b:a,r=rtl?a:b;if(sp==0){l=rtl?-1:-1;r=0}
  const slot=(i,c)=>"<div class='sl "+c+"'>"+(i<0?"":"<img src='"+p[i]+"'>")+"</div>";
  $('sp').innerHTML=slot(l,'L')+slot(r,'R');
  const nums=[a,b].filter(x=>x>=0).map(x=>x+1).join('・');
  $('pgr').innerHTML="<div class='r1'>"+ttl()+"　"+nums+" / 全"+L+"ページ</div><div class='r2'><button class='ctl' id='pv'>"+(rtl?"次へ ◀":"◀ 前へ")+"</button><button class='ctl' id='nx'>"+(rtl?"▶ 前へ":"次へ ▶")+"</button>"+(sp==n-1?ansBtn:"")+"</div>";
  $('pv').onclick=()=>{sp+=rtl?1:-1;draw()};$('nx').onclick=()=>{sp+=rtl?-1:1;draw()};
 }
}
async function showAns(){
 $('rd').style.display='none';const x=$('xp');x.style.display='block';x.className=sb;
 x.innerHTML="<div class='xbar'><button class='xb' onclick='back()'>◀ 問題にもどる</button><span class='xt'>"+ttl()+" 答え</span><span class='zm'>拡大<button class='ctl' onclick='zoom(-.25)'>−</button><button class='ctl' onclick='zoom(.25)'>＋</button></span></div><div class='xin'><p class='lg'>読み込み中…</p></div>";
 x.scrollIntoView();const key=y+'_'+sb;
 try{await load('a_'+key)}catch(_){x.querySelector('.xin').innerHTML='<p class="lg">読み込みに失敗しました</p>';return}
 const A=IMG[key+'_ans']||[],S=IMG[key+'_sheet']||[];
 let h="<h2 class='xh'>✏️ 正答表（配点・採点上の注意つき）</h2><div class='aw'>"+A.map(u=>"<img class='ai' src='"+u+"'>").join('')+"</div>";
 h+="<h2 class='xh'>📝 解答用紙</h2>"+(S.length?"<p class='lg'>印刷して使うときは、上の「印刷用カコモンセット（PDF）」が便利です。</p><div class='aw'>"+S.map(u=>"<img class='ai' src='"+u+"'>").join('')+"</div>":"<p class='lg'>この年度は解答用紙の原本がありません。ノートに解答してください。</p>");
 h+="<p class='note'>※千葉県教育委員会公表の問題・正答表をもとにしています。</p><div style='text-align:center'><button class='xb' onclick='back()'>◀ 問題にもどる</button></div>";
 x.querySelector('.xin').innerHTML=h;zoom(0);
}
function zoom(d){Z=Math.max(1,Math.min(3,Z+d));$('xp').style.setProperty('--z',Z)}
function back(){$('xp').style.display='none';$('rd').style.display='flex';$('rd').scrollIntoView()}
$('ga').onclick=showAns;
$('m1').onclick=()=>{mode=1;render()};$('m2').onclick=()=>{mode=2;sp=0;render()};
$('bk').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.addEventListener('keydown',e=>{if(mode!=2||!y||!sb||$('rd').style.display=='none')return;const r=sb=='japanese';if(e.key=='ArrowRight'){sp+=r?-1:1;draw()}if(e.key=='ArrowLeft'){sp+=r?1:-1;draw()}});
let tx=null;$('sp').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('sp').addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)<60)return;const r=sb=='japanese';sp+=(d<0)!==r?1:-1;draw()});
</script></body></html>
