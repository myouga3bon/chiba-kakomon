const M={"2021": {"w": "令和３", "s": {"japanese": {"n": 14, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 9, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2022": {"w": "令和４", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 12, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2023": {"w": "令和５", "s": {"japanese": {"n": 18, "a": 1, "sh": 1}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2024": {"w": "令和６", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 16, "a": 1, "sh": 1}}}, "2025": {"w": "令和７", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2026": {"w": "令和８", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 17, "a": 1, "sh": 1}}}};const K={"2025_english": [[4, "1 No.1", "B", "「大丈夫？」「いいえ、手伝って（Please help me.）」と頼まれたので、Sure.（いいよ）。"], [4, "1 No.2", "D", "「祖父母と何をしたの？」と聞かれているので、「一緒に料理してたくさん食べた」。"], [4, "1 No.3", "D", "「それは授業のため？」と聞かれているので、「いいえ、ただの楽しみのため」。"], [4, "2 No.1", "D", "「家の前に自転車がある」「ドアの右側に花がある」家。"], [4, "2 No.2", "C", "真ん中がエイミー、一番背の高いのが姉のリサ、その隣がサラ。"], [4, "3 No.1", "B", "父がまずテーブルを動かし、エマに Can you clean the floor? と頼んでいる。窓はほかが全部終わってから。"], [4, "3 No.2", "C", "We need new members who can speak English!（英語を話せる新メンバーを求めている）。"], [4, "4 ①", "D", "ライアンは talking and thinking together is as important as practicing（一緒に話し考えることが練習と同じくらい大切）と言っている。"], [4, "4 ②", "A", "ミサは better friendships help us to make our team stronger（よりよい友情がチームを強くする）と言っている。"], [5, "5 (1)", "those", "people（複数）につくので、that の複数形 those。"], [5, "5 (2)", "worn", "have never ～ は現在完了の経験なので過去分詞。wear-wore-worn。"], [5, "5 (3)", "オ→イ→ア→エ→ウ", "I wish I had more time to read.「読む時間がもっとあればなあ」。I wish の後は過去形（仮定法）。"], [5, "5 (4)", "ウ→ア→オ→イ→エ", "I think team sports such as soccer are good for children.「サッカーのようなチームスポーツは子どもによい」。such as ～ で例を挙げる。"], [5, "5 (5)", "イ→オ→ア→ウ→エ", "You should close the door to keep the room cool.「部屋を涼しく保つためにドアを閉めて」。keep A B＝AをBの状態に保つ。"], [6, "6 (1)", "解答例：You're still playing games! Stop and do your homework now.（10語）", "①で宿題を忘れないでと言われたのに、時計が進んでもまだゲームをしている。④で「ごめん、今やめる」と答えているので、注意して宿題をするよう言う文。10語程度・2文以内。"], [6, "6 (2)", "解答例：Can you get that small book for me, please?（9語）", "女の子は高い棚の本に手が届かない。④「いいよ。この本？」と答えているので、「あの小さな本を取ってくれますか」とお願いする文。"], [8, "7(1) ①", "エ→イ→ウ→ア", "ケントがアンケート結果（円グラフ＝エ）を説明し、マキがアプリ「What's for Dinner?」（イ）と、冷蔵庫・スマホとつないで献立を決めるしくみ（ウ）を説明し、最後にユカが環境（電力・食品ロス＝ア）について話している。"], [8, "7(1) ②", "イ", "アプリは家族の健康状態をチェックして献立を決めるが、「各家族に健康のアドバイスをする」とは言っていない。ア：家族の情報を集める、ウ：レシピを選ぶ、エ：食品廃棄を減らす、は本文にある。"], [8, "7(1) ③", "open", "アプリで冷蔵庫の中がわかるので、確認のために冷蔵庫を「開ける」必要がなく、冷気が逃げない。"], [8, "7(1) ④", "ア", "First, we asked our family, friends and teachers what kind of apps they wanted.（まず聞き取り調査をした）。イ：学校ではなく家庭と環境。ウ：写真を送るのは利用者のほう。エ：電力の節約量をチェックするとは言っていない。"], [10, "7(2) ①", "エ", "You must wear socks inside the cafe.（靴下をはかないと入れない）。12歳未満は入れないが、14歳は入れる。"], [10, "7(2) ②", "ウ", "広告に please visit the cat a few times before you decide. Visit our cafe and get to know your future family member! とある。"], [10, "7(2) ③", "エ", "You can touch the cats, but you cannot hold them. ア：子どもがねこをこわがるのではなく、ねこが子どもをこわがる。イ：週末は10〜4時で平日より短い。ウ：ねこは店内で過ごしている。"], [12, "8 (1)", "ア", "直前で「いつも前に進もうとしている」、However に続けて、ニュージーランドで元気をなくし何もしたくなくなった話が始まる。「突然進み続ける方法を忘れた」。"], [12, "8 (2)", "ウ", "ikigai を聞く質問として「あなたの人生の目的は？」「何をするのが好き？」と同じ種類のもの。ア・イ・エは自分の得意・好き・他人のためにできることを聞く質問。ウ「社会はあなたに何をしてくれるか」は生きがいを聞く質問として合わない。"], [12, "8 (3)", "解答例：is related to other people's happiness（6語）", "サトミは I found that my ikigai is related to other people's happiness, too. と言っている。ビリーも「人を幸せにすると自分も幸せ」と続けている。6〜10語。"], [12, "8 (4)", "エ", "the word has more meanings and it is difficult to explain in other words. So the Japanese word ikigai is used in other languages（ほかの言葉で説明しにくいので、そのまま使われている）。"], [12, "8 (5)", "エ", "They also believe people who have one are healthier and live longer. ア：人々が話したがらなかったのではない。イ：カレンは日本語の単語を使っただけ。ウ：記事を読んだのは日本に帰ってから。"], [13, "9 (1)", "エ", "ジョンは No, not at all. 交換留学生として来て、日本料理に恋をした、と答えている。「料理人になるために来たのか」に対する否定。"], [13, "9 (2)", "イ", "15年前に来日し、店を開いたのは約2年前。「シェフになるのに10年以上かかったということ？」に対し、「学ぶことが多くて長くかかった」と答えている。"], [13, "9 (3)", "ア", "ジョンは「ここに住み続けて日本のことをもっと学びたかった」と答えている。「なぜ自分の国ではなく日本で店を開いたのか」。"], [13, "9 (4)", "ア", "「10年後に自分の国で2号店を開きたい」と答えているので、「今、夢はありますか」。"]], "2025_japanese": [[5, "一(1)", "ウ", "加藤さんは「バスで、練習試合に向かった兄に…」と話し始めたので、坂本さんは「バスで行ったのはお兄さん？加藤さん？」と、だれがバスで行ったのか（主語）がわからなかった。"], [5, "一(2)", "エ", "加藤さんが急いでいたのは、最寄りのバス停の出発時刻を見たら、あと5分しかなかったから。その理由を初めに言わなかった。"], [5, "一(3)", "エ", "坂本さんは姉に「いつものノート」とだけ頼んで、色違いのノートを買ってこられた。親しい間柄だと、関わりから分かり合えている気になって、詳しく説明しなくても伝わると思ってしまう。"], [6, "二(1)", "きぬ", "「絹」＝蚕のまゆからとった糸・布。"], [6, "二(2)", "あわ（い）", "「淡い」＝色や味がうすい。"], [6, "二(3)", "せいじゃく", "「静寂」＝静かでひっそりしていること。「寂」は「じゃく」と読む。"], [6, "二(4)", "とうほん", "「謄本」＝原本の内容をすべて写した文書（戸籍謄本）。"], [6, "三(1)", "困", "「困っている」。"], [6, "三(2)", "授（かる）", "「授かる」＝目上の人や神仏からいただく。"], [6, "三(3)", "航路", "船や飛行機の通る道筋。"], [6, "三(4)", "初志", "「初志貫徹」＝最初に決めた志をつらぬき通すこと。"], [8, "四(1)", "ウ", "サイエンスでは、条件をそろえて実験し、データは平均化され、一回きりの出来事は「外れ値」として扱われる。つまり普遍的な（一般的な）結論を導くのに使えないデータ。"], [8, "四(2)", "Ⅰ イ、Ⅱ オ", "サイエンスは「だれが考えてもそう解釈できる無理のない論理」をめざすので、一般化できる（Ⅰ・イ）論理を重視し、「わたし」を排除する。アートでは、ほかのだれとも同じではない（Ⅱ・オ）「わたし」が求められる。"], [9, "四(3)", "ア", "サイエンスもアートも、根っこには「!」と感じるこころ＝身のまわりの出来事や現象に目を向けて感情が高まること（プチ感動）が共通している。"], [9, "四(4)", "ア", "ふだんの生活の一場面や自然の美しさを「いいなあ」と感じている、それをアートで表現したい、という流れ。"], [9, "四(5)", "ウ", "同じ木漏れ日でも、物理学・植物学・認知科学など、どこに着目して問いを立てるかで研究の内容が変わる。それを知っておけば、自分の興味や関心に照らして学ぶべき分野を考えられる。"], [10, "四(6)(a)", "ア", "アートでは「!」を感じるこころが大切で、サイエンスのように「たった一つの正解」があるわけではない。"], [10, "四(6)(b)", "（例）少しだけ頭をゆるめて感じるようにすることで、わたしだけの「!」をアートの表現の中に見いだす", "筆者は「頭をゆるめて、からだを通して感じるようにすると『!』に出会える」と述べている。「!」「わたし」「表現」を使い、40〜50字にまとめる。"], [13, "五(1)", "③", "「軽やかで」の「で」は形容動詞「軽やかだ」の連用形の活用語尾。③「誇らしげで」も形容動詞「誇らしげだ」の活用語尾。①「朱墨で」②「形で」は格助詞、④「叫んで」は接続助詞。"], [13, "五(2)", "ア", "生徒たちは「熱中症になったらどうすんの」と言っていたが、遠田が窓を開けた瞬間、一陣の風が暑気を切り裂き、庭の桜の葉や半紙を揺らした。空気を一変させるような勢いのある風。"], [13, "五(3)", "ウ", "遠田は「そういう習慣をつけときゃ、そのうち真夏にも冬の『風』を書けるようになる」と言った。自分の体験（感じたこと）を思い出しながら練習すれば、どんな状況でも思い描いた字を書けるようになる、という意図。"], [13, "五(4)", "エ", "遠田は一人一人の書に花丸を描いて返し、「この『虫』みたいな部分の角っちょは…」と、それぞれの字にこめられた思いをくんで評価しつつ、改善点もきちんと指摘している。"], [14, "五(5)", "Ⅰ イ、Ⅱ エ", "「俺」は、遠田が生徒一人一人の感じた多様な「風」を引き出している（Ⅰ・イ）こと、手本の文字がうまいだけでなく、型破りな指導で生徒の上達を願っている（Ⅱ・エ）ことに、逸材だと感じている。"], [14, "五(6)", "イ", "悪寒の「風」を書いた男の子にも、遠田はいたってマイペースで花丸を描いた。生徒がどんな字を書いても、自分の指導方針を曲げずに評価したいという心情。"], [14, "五(7)", "（例）自分たちの感性を大切にして指導してくれる遠田を、とても信頼している", "生徒たちは遠田のところに次々と書を見せに来たり、いたずらをしたりと、遠田を慕っている。「感性」「指導」「信頼」を使い、25〜35字。"], [15, "六(1)", "イ", "秘蔵の太刀を盗まれたのは、主語の「故持明院の中納言入道」。"], [15, "六(2)", "ゆえに", "「ゑ」は「え」に直す。「ゆゑに」→「ゆえに」。"], [15, "六(3)", "ウ", "侍が差し出した太刀を見て、入道は「これは、我が太刀にあらず（これは私の太刀ではない）。僻事なり（間違いである）」と言った。"], [15, "六(4)", "ア", "入道は、本当は自分の太刀だったが、侍の恥辱を思って「自分のものではない」と言って返した。取り調べられた侍の立場（名誉）を守るため。"], [16, "六(5)(a)", "イ", "川島さんの言う「余の侍の中に〔Ⅰ〕ありけるを…侍沙汰し出して」の部分。侍の中にいた「犯人」を探し出した。"], [16, "六(5)(b)", "エ", "「積善の家には必ず余慶有り」の順に読むには、「積善之家必有余慶」の「有」から「余慶」へ返るので、「有」に二点、「慶」に一点（または「余慶」をまとめて）をつける。正答表の形はエ。"], [16, "六(5)(c)", "（例）犯人の侍を許さないで、捕まえていたら", "入道は犯人の侍の恥を思って許したので、それが善い行い（積善）となり子孫も繁昌した。もしその侍を許さず捕まえていたら、という仮定。「……ないで、……」の形で15〜20字。"], [17, "七", "作文（正答表の解答例を参照）", "条件：①二段落・十行以内、②前段でA〜Cのどれか一つを選び、こめられたキツネの気持ち、③後段で自分の体験（見聞きしたことも可）をふまえて、そこから読み取れることを説明。解答例A：負け惜しみで取れなかった悔しさを紛らわす気持ち。解答例B：取れなかった残念な気持ちが強く、あきらめきれずにいる。解答例C：工夫もせずにあきらめるのが残念で、目の前のチャンスを逃したくない。どれを選んでも採点に影響しない。"]], "2025_math": [[2, "1(1)①", "−6", "かけ算を先に。(−7)×3=−21 なので、15−21=−6。"], [2, "1(1)②", "7a+5b", "(6a+10b)÷2=3a+5b。3a+5b+4a=7a+5b。"], [2, "1(1)③", "4xy", "(x+y)²=x²+2xy+y²、(x−y)²=x²−2xy+y²。ひくと 2xy−(−2xy)=4xy。"], [2, "1(2)①", "ウ", "3つの数は x−1, x, x+1。(x−1)(x+1)−2x=62 より x²−1−2x=62、x²−2x−63=0。"], [2, "1(2)②", "あ 9", "(x−9)(x+7)=0 で x=9, −7。正の整数なので x=9（8, 9, 10 で 80−18=62 ✓）。"], [3, "1(3)①", "エ", "√4=2 は整数（有理数）なので「無理数」は誤り。ア・イ・ウは正しい。"], [3, "1(3)②", "いう 10", "90n=2×3²×5×n。√ が自然数になるには、素因数の指数がすべて偶数になればよいので、n=2×5=10（√900=30）。"], [3, "1(4)①", "え 6", "四分位範囲＝第3四分位数−第1四分位数＝14−8＝6点。"], [3, "1(4)②", "お 3", "得点は4点きざみ（0,4,…,20点）。32人の第3四分位数は 24番目と25番目の平均で14点なので、24番目が12点、25番目が16点。つまり16点以上は25〜32番目の8人。16点が5人なので、20点は 8−5=3人。"], [4, "1(5)①", "かき 2/7", "8枚から2枚の選び方は 8×7÷2=28通り。長さ2cmになるのは、辺 AB, DC, EF, HG の4本と、面 AEHD・BFGC の対角線（√(1²+(√3)²)=2）の4本で、合計8通り。8/28=2/7。"], [4, "1(5)②", "くけ 3/7", "2cmより長いのは、面 ABFE の対角線 √7（4本）、面 ABCD の対角線 √5（4本）、立体の対角線 √8（4本）の12通り。12/28=3/7。（1cm, √3cm の辺は2cmより短い）"], [4, "1(6)①", "こ 3、さし −1", "3x+2y=7 と 5x−4y=19 を連立する。1つ目を2倍して足すと 11x=33、x=3。代入して y=−1。交点は (3, −1)。"], [4, "1(6)②", "すせ −5", "3本目の直線も (3, −1) を通るので、2×3+a×(−1)=11、6−a=11、a=−5。"], [5, "1(7)①", "イ", "回転移動では、点は回転の中心Oを中心とする円の弧の上を動くので、跡は直線ではない。OA=OA′、∠COC′=∠AOA′=∠BOB′=110° は正しい。"], [5, "1(7)②", "作図（正答表の図を参照）", "55° は 110° の半分。①Oを中心に OA の長さの円（弧）をかく。②∠AOA′（110°）の二等分線を作図する（A と A′ から等しい距離の点を求めて O と結ぶ）。③その二等分線と弧の交点が P。"], [6, "2(1)", "そた 1/4", "B(6, 9) を代入して 9=a×36、a=1/4。"], [6, "2(2)", "ちつ 12", "A の y 座標は 1/4×4=1、A(−2, 1)。直線 AB は傾き (9−1)/(6+2)=1、切片3。△OAB を y 軸で2つに分けると、1/2×3×2＋1/2×3×6＝3＋9＝12 cm²。"], [7, "2(3)", "てと 40", "直線 AO は y=−x/2 なので C(c, −c/2)。平行四辺形 ABCD は対角線の中点が一致するので D＝A＋C−B＝(c−8, −c/2−8)。△OCD の面積は 1/2×|c×(−c/2−8)−(−c/2)×(c−8)|＝1/2×12c＝6c。6c＝24 より c＝4、D(−4, −10)。b＝xy＝(−4)×(−10)＝40。"], [8, "3(1)", "(a) ア、(b) エ、(c) オ", "OA と OC は半円Oの半径なので等しい。2辺が等しいので △OCA は二等辺三角形。"], [9, "3(2)", "証明（正答表を参照）", "△GAF と △EBD で、①二等辺三角形 OCA の頂角の二等分線は底辺を垂直に2等分するので ∠FGA=90°。②直径 AB に対する円周角なので ∠DEB=90°。①②より ∠FGA=∠DEB…③。④弧 CE に対する円周角なので ∠GAF=∠EBD。③④より、2組の角がそれぞれ等しいので △GAF∽△EBD。"], [9, "3(3)", "なに 12、ぬ 3、ね 7（12√3/7 cm²）", "OA=OC=CA=6 なので △OCA は正三角形、AB=12。∠ACB=90° なので BC=√(12²−6²)=6√3。BD:DC=1:2 より BD=2√3、DC=4√3。AD=√(6²+(4√3)²)=√84=2√21。△ACD の面積は 1/2×6×4√3=12√3。△EBD∽△CAD（∠E=∠C=90°、対頂角）で、相似比 BD:AD=2√3:2√21=1:√7。面積比は 1:7 なので、△EBD=12√3/7 cm²。"], [11, "4(1)", "の 5", "O から A までは、M を中心とする半径10cm、中心角90°の弧。2π×10×90/360=5π cm。"], [11, "4(2)", "はひ 35、ふ 3（35π/3 cm）", "AB の長さはおうぎ形の弧の長さと等しく、2π×10×30/360=5π/3。BC も 5π。合計 5π＋5π/3＋5π＝35π/3 cm。"], [11, "4(3)", "へほ 10", "円Dの周は円Pの周の2倍。円Dの半径は母線の長さなので、2π×(母線)＝2×(2π×5)、母線＝10cm。"], [11, "4(4)", "ま 3", "円Eを1周する間に円錐は R/r＝24/9＝8/3 回転する。回転数が整数になると X が元に戻るので、8/3×k が整数になる最小の k＝3 周。"], [11, "4(5)", "み 8", "3周する間に円錐は 8/3×3＝8 回転し、1回転ごとに点 X が円E に接して跡が残る。元の位置を含めて8個。"], [11, "4(6)", "むめも 135", "円錐が1回転すると、接点は円Eの上を 2π×9 だけ進む。中心角では 360×9/24＝135°。X₅ は 135×5＝675°→315°、X₆ は 135×6＝810°→90° の位置。差は 225° なので、180°以下で考えると 360−225＝135°。"]], "2025_science": [[2, "1(1)", "エ", "レントゲンが発見した放射線は X線。医療のレントゲン撮影などに使われる。電波・赤外線・紫外線は放射線ではない。"], [2, "1(2)", "ア", "酸化鉄は鉄と酸素が結びついてできる。鉄の酸化は熱を出す発熱反応で、化学かいろに利用されている。"], [2, "1(3)", "イ", "遺伝子の本体は DNA（デオキシリボ核酸）。染色体は DNA をふくむ構造、形質は生物のもつ特徴。"], [2, "1(4)", "イ", "サンゴは浅くてあたたかい海にすむので、示相化石としてその環境を示す。"], [4, "2(1)", "ア", "一生水中で生活し、えらで呼吸するのは魚類。両生類は子はえら、親は肺と皮膚で呼吸する。"], [4, "2(2)", "ア", "節足動物は、体の外側をおおう外骨格をもち、体やあしに節がある。外とう膜は軟体動物の特徴。"], [4, "2(3)", "イ、オ", "昆虫類は、体が頭部・胸部・腹部に分かれ、あしが6本（3対）。セイヨウミツバチとカブトムシ。オカダンゴムシ・アメリカザリガニ・ミジンコは甲殻類、アサリは軟体動物。"], [4, "2(4)", "x ウ、y オ、z ア", "背骨がある動物（5グループ）のうち、x「一生肺で呼吸」で はい なのは ホニュウ類・鳥類・ハチュウ類（3）。y「胎生か」で いいえ なのは 鳥類・ハチュウ類（2）。z「羽毛におおわれているか」で はい なのは 鳥類（1）。グループの数が 3→2→1 と減る。"], [6, "3(1)", "イ", "光ファイバーは、光が内部で全反射をくり返して端まで進むしくみ。アは屈折、ウはプリズムによる分散、エは凸レンズ（虫めがね）の屈折。"], [6, "3(2)", "ア", "空気→ガラスに入るとき屈折角は入射角より小さく（境界面から遠ざかる向きに曲がり）、ガラス→空気に出るときは屈折角が入射角より大きくなる。台形の平行でない面から出るので、アの道すじ。"], [6, "3(3)", "ウ", "液体から空気へ光が進むとき、屈折角は入射角より大きくなる（入射角＜屈折角）。そのため物体は実際より浮き上がって見える。"], [6, "3(4)", "作図（正答表の図を参照）", "まず図4から、液面がQの高さのとき A が A′ に見えた関係を使い、B が OP 上に見える液面の高さを方眼で決める（B から A′ と同じ傾きで進む光が、液面で屈折して O に届く位置）。液面の線を実線でかき、B→液面の点→O を結んで、矢印を光の進む向き（B から O へ）につける。"], [7, "4(1)", "ウ", "晴れた日に水たまりがなくなるのは、液体の水が水蒸気になる蒸発。ア霧、イペットボトルのくもり、エ湯気は、水蒸気が冷やされて水になる現象。"], [8, "4(2)", "作図（正答表の図を参照）", "コップがくもり始めた10℃が露点なので、空気中の水蒸気量は10℃の飽和水蒸気量 9.4 g/m³。22℃・10℃の空気は 9.4 まで、6℃の空気は飽和水蒸気量が 7.3 g/m³ しかないので 7.3 まで（余った分は水滴になる）塗る。"], [8, "4(3)", "オ", "水蒸気量が同じなので、露点（くもり始める水温）は変わらない。室温が上がると飽和水蒸気量が大きくなるので、湿度は低くなる。"], [8, "4(4)", "183 g", "26℃の飽和水蒸気量は 24.4 g/m³。湿度25%→50% なので、1m³ あたり 24.4×(0.50−0.25)＝6.1 g 増えた。室内は30.0m³ なので 6.1×30＝183 g。"], [10, "5(1)", "イ", "蒸留は、物質の沸点のちがいを利用して、液体の混合物から目的の物質を分けて取り出す方法。"], [10, "5(2)", "エ", "温度計の液だめ（球部）は、枝つきフラスコの枝の高さ（出ていく蒸気の通り道）に置く。液体の中に入れない。"], [10, "5(3)", "イ", "A は火がついたのでエタノールを多くふくむ。B はついてもすぐ消えたので A よりエタノールの濃度が低い。C・D は火がつかないが、甘いにおいがあり、水以外のものもふくむ（ウは誤り）。"], [10, "5(4)", "2.4 g", "23×0.104＝2.392 → 小数第2位を四捨五入して 2.4 g。"], [12, "6(1)", "ウ", "地球は西から東へ自転しているので、太陽は東から西へ動いて見える。これを太陽の日周運動という。"], [12, "6(2)", "ア", "図3で1時間あたりの間隔は 2.4cm。P（日の出）から9時の印までは 11.2cm なので、11.2÷2.4＝4時間40分前。9時−4時間40分＝4時20分ごろ。"], [12, "6(3)", "ウ", "日の入りが15分おそい地点Bは、地点Aより西にある。西にある地点ほど南中時刻はおそいので、Aの方が早い。緯度が同じなら南中高度は同じ。"], [12, "6(4)", "12.6 度", "夏至の南中高度＝90−緯度＋23.4＝90−36.0＋23.4＝77.4°。パネルを光に垂直にするには、設置角度＝90−77.4＝12.6°。"], [13, "7(1)", "イ", "亜鉛板を硫酸銅水溶液に入れると、銅イオンが亜鉛から電子を受けとり、銅と亜鉛イオンができる。よって銅よりも亜鉛の方がイオンになりやすい。"], [14, "7(2)", "ア", "ダニエル電池の銅板（＋極）では、亜鉛板から導線を通って来た電子2個を、水溶液中の銅イオン Cu²⁺ が受けとって銅原子になり、銅板に付着する。"], [14, "7(3)", "Mg²⁺", "硫酸マグネシウム MgSO₄ は、マグネシウムイオン Mg²⁺ と硫酸イオン SO₄²⁻ に電離する。2＋は右上に小さく書く。"], [14, "7(4)", "ウ", "実験2では亜鉛板が－極。実験3では、マグネシウムの方が銅よりイオンになりやすいので、マグネシウム板が電子を出して－極になり、同じ向きに電流が流れた。"], [16, "8(1)", "オ", "葉の表側（P）に近い方が道管、裏側（Q）に近い方が師管。a は維管束。根から吸収した水の通り道は道管。気孔は葉の裏側（Q）に多い。"], [16, "8(2)", "作図（正答表の図を参照）", "気孔は、三日月形の2つの孔辺細胞に囲まれたすき間。図2の中央の、孔辺細胞にはさまれたすき間の部分を塗りつぶす。"], [16, "8(3)(a)", "イ", "A（表を塗る）＝裏＋茎＝12.4g、B（裏を塗る）＝表＋茎＝2.3g、C（表と裏を塗る）＝茎＝1.0g。裏側の蒸散量の方が多く、茎（葉以外）からも蒸散している。"], [16, "8(3)(b)", "8.8 倍", "裏＝12.4−1.0＝11.4g、表＝2.3−1.0＝1.3g。11.4÷1.3＝8.76… → 8.8倍。"], [18, "9(1)", "ア、エ", "力学的エネルギーは保存される。Aでは位置エネルギーだけ、Bでは運動エネルギーだけ、Cでは（Aと同じ高さで止まるので）位置エネルギーだけをもつ。"], [18, "9(2)", "エ", "Cの位置では小球は一瞬止まっている（速さ0）。糸を切ると重力だけがはたらくので、真下（エ）に落ちる。"], [18, "9(3)", "イ", "ものさしと一緒に動くとき、本との摩擦で運動エネルギーが熱などに変わるので、位置エネルギーと運動エネルギーの和は一定ではない。"], [18, "9(4)", "55 g", "図4で高さ20cmのとき、20gで8cm、30gで12cm、40gで16cm。1gあたり0.4cm動くので、22÷0.4＝55g。"]], "2025_social": [[2, "1(1)", "ウ", "下総・上総・安房の三国を千葉県にまとめたのは、明治政府の廃藩置県などの中央集権化の流れ。その必要が生じたのは、開国して欧米と条約を結び、独立を保つ必要が出てきたこと。日米修好通商条約（1858年、ウ）。"], [2, "1(2)", "ウ", "1967年に公害対策基本法が制定され、1971年に環境庁が設置された（2001年に環境省）。環境基本法は1993年。"], [3, "1(3)", "イ", "X：資料1の全項目の上位5位に入るのは東京都・大阪府・福岡県の3つ。資料2で最大は宿泊費34.6%。正しい。Y：資料2で2番目に多いのは飲食費ではなく買物代26.4%なので誤り。Z：千葉県1.8万円は東京都14.8万円の約8分の1。買物代＋飲食費＋娯楽等＝26.4＋22.6＋5.1＝54.1%で半数以上。正しい。"], [3, "1(4)", "エ", "生成AIの回答は誤りをふくむことがあるので、「全面的に信用して積極的に活用」は注意事項としてあてはまらない。"], [4, "2(1)", "Ⅰ ア、Ⅱ エ", "飛騨・木曽・赤石山脈をまとめて日本アルプスという。その東側には「大きな溝」という意味のフォッサマグナがある。"], [4, "2(2)", "B エ、D ウ", "ぶどう1位の山梨（ア）、2位の長野（エ）、みかん1位の和歌山（ウ）。りんご2位の長野（エ）、5位前後の山形（イ）。地図のBは長野県、Dは和歌山県。"], [4, "2(3)", "イ", "石狩平野は、かつて栄養分が少なく水はけの悪い泥炭地が広がっていた。客土で土地を改良し、稲作地帯になった。"], [5, "2(4)①", "エ", "地形図で避難場所の記号の位置を確かめると、「二つの高等学校」は誤り（地図記号で学校の種類を確認する）。ア・イ・ウは地形図・浸水想定区域図から読み取れる。"], [5, "2(4)②", "ウ", "災害時は、指示された避難場所や安全な経路で避難する。自宅近くの慣れた場所に勝手に向かうのは誤り。"], [6, "3(1)", "Ⅰ イ、Ⅱ ア、Ⅲ ウ", "東京は日付変更線の西側なので、シアトルより時刻が進んでいる。時差17時間は経度差 17×15＝255度。東経135度から255度離れた西側は、135＋x＝255 で西経120度。"], [6, "3(2)", "ア", "先住民の権利が尊重され、ウルル（エアーズロック）がある、鉄鉱石・ボーキサイトが豊富なのはオーストラリア。輸出品が衣服などの繊維から造船・自動車・鉄鋼に変わり、日本と時差がないのは大韓民国。"], [7, "3(3)", "Ⅰ エ、Ⅱ イ、Ⅲ イ", "中国のシェンチェン・アモイなどの経済特区は南部の沿海部にある。外国企業を受け入れて工業化を進め、工業製品を世界に輸出して成長した。一方で化石燃料の大量消費や交通渋滞で大気汚染が問題になっている。"], [7, "3(4)", "A", "夏に雨が少なく冬に雨が多い地中海性気候。乾燥に強いオリーブなどが栽培され、夏の日差しを避けるため窓が小さく石造りの家が多い。地中海沿岸の A。"], [7, "3(5)", "（例）氷河にけずられた谷に、海水が入り込む", "ノルウェーなどのフィヨルドは、氷河がけずってできたU字谷に海水が入りこんでできた細長い湾。「氷河」「海水」を使い20字以内。"], [8, "4(1)", "ウ", "7世紀に、ムハンマドがイスラム教を開いた。アのイエスは1世紀ごろ、イの孔子は紀元前6世紀ごろ、エのシャカは紀元前5世紀ごろ。"], [9, "4(2)", "エ→イ→ウ→ア", "エ：聖徳太子が遣隋使（小野妹子）を送る（7世紀初め）→イ：空海が真言宗を開く（平安初期）→ウ：平清盛の日宋貿易（平安末期）→ア：足利義満の勘合貿易（室町時代）。"], [9, "4(3)", "（例）座を廃止し、税を免除することで商人", "織田信長の楽市・楽座は、特権をもつ同業者組合の座を廃止し、市場の税を免除して、商人が自由に営業できるようにした。「座」「免除」を使い20字以内。"], [9, "4(4)", "ア", "室町文化は禅宗の影響を受けた（書院造・水墨画など）。元禄文化は、政治の安定と商業の発達を背景に、大阪・京都などの上方を中心に栄えた町人文化。"], [9, "4(5)", "パネル D、絵画 浮世絵", "ゴッホは歌川広重の浮世絵を模写するなど、浮世絵から大きな影響を受けた。浮世絵は江戸時代の文化で、俵屋宗達と同じ時代のパネルD。"], [10, "5(1)", "イ", "手紙を書いたのはインドの独立運動を指導したガンディー。インドを支配していたのはイギリスで、ナチズムと同じく帝国主義（植民地支配）に反対している。"], [10, "5(2)", "エ", "差出人Xは非暴力・不服従を説いたガンディー。チェコスロバキアを屈服させ、ポーランドを攻め、デンマークを占領したのは、ドイツのヒトラー。"], [10, "5(3)", "ア→エ→ウ", "1940年の33年前は1907年。それ以降のできごとは、ア：ワシントン会議（1921〜22年）→エ：治安維持法（1925年）→ウ：国際連盟脱退（1933年）。イの下関条約は1895年なので入らない。"], [11, "5(4)", "エ", "日本は政府の富国強兵・殖産興業政策がきっかけ（B）、イギリスは綿織物の大量生産のための技術革新（A）が独自の点。共通するのは、資本主義のしくみ（C）、長時間労働などの社会問題（D）、社会主義の主張の出現（E）。Fのニューディール政策はアメリカの政策。"], [11, "5(5)", "イ", "情報が国境をこえて世界に広まり、世界の結びつきが強まることをグローバル化という。"], [12, "6(1)", "ウ", "企業は利益の追求だけでなく、社会に貢献する「企業の社会的責任（CSR）」が求められる。仕事と生活の調和は「ワーク・ライフ・バランス」。"], [12, "6(2)", "エ、オ", "日本銀行は「銀行の銀行」として銀行に、「政府の銀行」として政府にお金を貸したり預かったりする。個人は預けられない。唯一の発券銀行でもある。"], [13, "6(3)", "Ⅰ イ、Ⅱ イ", "国民負担率が50%をこえるのは C（68.0）と D（55.1）で、社会保障負担率が最も低い D がスウェーデン、C がフランス。税負担率が2番目に低いのは日本なので A が日本、残る B（33.9%）がアメリカ。負担が小さく、政府の役割が「小さな政府」。"], [14, "7(1)", "エ", "A は納税額で選挙権が制限された人なので、すべての成人に選挙権がある普通選挙が実現していない。B は記名した用紙を見せているので、投票の秘密を守る秘密選挙が実現していない。"], [14, "7(2)", "イ", "地方裁判所は全国に50か所あり、裁判員裁判（重大な刑事事件の第一審）を行う。アは最高裁判所、ウは簡易裁判所（438か所）、エは高等裁判所（8か所）。"], [14, "7(3)", "（例）有権者の3分の1以上の署名を、選挙管理委員会", "首長や議員の解職請求（リコール）は、原則として有権者の3分の1以上の署名を集めて選挙管理委員会に提出し、住民投票で過半数の同意があれば解職される。"], [15, "8(1)", "エ", "貧しい人に無担保で少額のお金を貸し、事業を始めて自立できるようにするしくみはマイクロクレジット。バングラデシュのグラミン銀行が有名。"], [15, "8(2)", "資料 B、説明文 ウ", "ドイツは再生可能エネルギーの割合が41.0%で4か国中最も多い（B）。発電量は アメリカ（C）の方が多いので、再生可能エネルギーによる発電量は2番目。A は原子力が63.0%のフランス。"]], "2026_english": [[4, "1 No.1", "D", "「何か飲み物はいかが？（Would you like something to drink?）」への返事なので、Yes, please.（はい、お願いします）。"], [4, "1 No.2", "B", "「チョコレートとイチゴ、どっちをのせる？」と聞かれているので、Strawberries are better.（イチゴがいい）。"], [4, "1 No.3", "C", "How often ～? は「どのくらいの頻度で」。頻度を答えている Twice a week.（週に2回）。"], [4, "2 No.1", "A", "友だちと連絡を取りたい（communicate）ときに押すのは、メッセージを送る「左上の四角」。左上は A。"], [4, "2 No.2", "A", "「壁に花を飾り（I put flowers on the wall）、ソファーにプレゼントを置いた」部屋。テーブルにはケーキとピザ。"], [4, "3 No.1", "A", "クリスは「新聞記者（newspaper writer）になりたい」と言っている。Write for a newspaper."], [4, "3 No.2", "C", "「今日は職員室のブラウン先生、明日から1週間は理科室のグリーン先生が保管」。質問は tomorrow なので理科室。"], [4, "4 ①", "C", "旅行に行かなかった理由は it was too expensive to go abroad（海外は高すぎた）＝お金が足りなかった。"], [4, "4 ②", "D", "she decided to visit some more places there（国内のもっと多くの場所を訪ねると決めた）＝日本をもっと旅行したい。"], [5, "5 (1)", "オ→ウ→イ→エ→ア", "I will go there by bus.「バスでそこへ行きます」。will の後は動詞の原形 go、場所 there、手段 by bus の順。"], [5, "5 (2)", "エ→オ→ウ→イ→ア", "I think the boy playing soccer is his brother.「サッカーをしている少年が彼の兄弟だと思う」。playing soccer が後ろから the boy を説明する（現在分詞の後置修飾）。"], [5, "5 (3)", "イ→オ→ア→エ→ウ", "Do you know what time the movie starts?「映画が何時に始まるか知っていますか」。疑問文が文の中に入る間接疑問は〈疑問詞＋主語＋動詞〉の語順。"], [6, "6", "解答例：I like our school because our teachers are nice. My English teacher is especially interesting. He always tries to make us laugh during class.（24語）", "条件は①特徴や魅力を「一つだけ」②詳しい説明や具体例を書く、③20〜30語。最初の文で魅力を一つ言い、次の文で具体例を2文ほど足すと条件を満たしやすい。2つ以上の魅力を並べると条件違反になるので注意。"], [8, "7(1) ①", "エ→ア→イ→ウ", "picture 1 はケンが今乗っているカゴ付きの自転車（エ）。picture 2 は最初の自転車で、木のフレームでペダルがなく足で地面をける（ア）。picture 3 は前輪が大きく、ペダルが前輪についている（イ）。picture 4 は1885年、同じ大きさの車輪とチェーン（ウ）。"], [8, "7(1) ②", "エ", "発表は自転車のデザインの移り変わりを順に説明している。「自転車のデザインが時代とともにどう変わってきたか知って驚いた」がまとめとして合う。アは「最初から同じデザイン」で本文と逆。"], [8, "7(1) ③", "エ", "1885年の自転車は the bike had a chain that effectively moved the back wheel, so it could move faster（チェーンが後輪を効率よく動かしたので速くなった）。so の前が理由。"], [10, "7(2) ①", "ア", "チラシの最初に for a more eco-friendly future（より環境にやさしい未来のために）とあり、明かりを消して電気を節約するイベント。「エネルギーを節約し環境を守る」。"], [10, "7(2) ②", "イ", "二人は「無理なくできることをする」「簡単だから続けられる」と話している。「変化を起こすカギは小さなことから始めること」が続く。"], [10, "7(2) ③", "エ", "時間は 7:00 p.m. から「2時間」明かりを消すだけなので、「一晩中続き朝早く終わる」は誤り。イ：ジェニの「5年前に始めた」（2025年の5年前＝2020年）は正しい。ウ：FINISH はブラジルのカルロスなので正しい。"], [12, "8 (1)", "イ", "下線部のあとで「雨が降ると、乾いた地面が色とりどりの花でいっぱいになる」と具体的に説明されている。"], [12, "8 (2)", "エ", "「このようにして（in this way）多くの砂漠の植物が乾いた場所で育ち生きていける」。種が雨を待って育ち、また種を落として次の雨を待つ、というしくみを説明した段落の最後（エ）に入る。"], [12, "8 (3)", "キ→ア→エ→キ", "①砂漠の花畑の写真（キ）→②数週間後、種だけが残った地面（ア）→③また育つ答え＝雨が降り芽が出る（エ）→④そのおかげできれいに育った花畑（キ）。同じ符号を2回使ってよい。"], [12, "8 (4)", "ウ", "最後の方の Even in harsh places, wonderful things can happen.／although life is difficult, there is always hope. と同じ内容。"], [13, "9 (1)", "ア", "スペリングビーを「聞いたことがない」と答えたあとなので、「それについて教えてくれる？」。スージーは Sure. と説明を始めている。"], [13, "9 (2)", "ア", "つづりを間違えた人は座る（sit down）ので、最後まで「立っている」人が勝ち。"], [13, "9 (3)", "イ", "この後「だから何度も練習する」と続くので、アメリカの生徒にとってもつづりは「それほど簡単ではない」。"], [13, "9 (4)", "エ", "つづりだけに興味をもたれると悲しい、と言っている。ノブも「海外で多くの人と話したい」と答えているので、「毎日英語を話す練習をすること」。"]], "2026_japanese": [[5, "一(1)", "エ", "坂井さんは、まず「ストレスの主な原因の一つに『情報の洪水』がある」と原因を示し、次に大量の情報が脳を混乱させるという内容を説明し、最後に「だから距離を置くことでストレス軽減になる」と結論を話している。"], [5, "一(2)", "イ", "坂井さんの「自分の生活を見直すという明確な目的があると成功しやすい」、杉田さんの「日常的に節度を守ってデジタル機器を使う習慣がつくといい」という話から、意義を考えて目的を決め、使用時間を決める方法が合う。いきなり大きく変えるのは難しい、とも言っている。"], [5, "一(3)", "ウ", "坂井さんは「実践することで、デジタル機器によるストレスと社会問題との関連についての検証もできる」と言っている。自分で取り組むことでストレスの原因を知り、実行の前後の変化を確かめられる、という理由。"], [6, "二(1)", "あ（てた）", "「宛てる」＝手紙などを送る相手として指定すること。"], [6, "二(2)", "まかな（う）", "「賄う」＝必要なものをととのえてまにあわせること。"], [6, "二(3)", "ほうこう", "「芳香」＝よい香り。「芳」は「かんばしい」とも読む。"], [6, "二(4)", "きゅうりょう", "「丘陵」＝なだらかな起伏が続く低い山地。"], [6, "三(1)", "果（たす）", "「約束を果たす」＝やりとげる。"], [6, "三(2)", "盛（り）", "「盛り上げる」。「盛」の形に注意。"], [6, "三(3)", "救護", "けが人や病人を助けて手当てをすること。「救」と「護」。"], [6, "三(4)", "花鳥", "「花鳥風月」＝自然の美しい風物。"], [8, "四(1)", "②", "①残す（五段）、②薄れ（「薄れる」下一段）、③切っ（五段）、④浮かぶ（五段）。活用の種類が異なるのは②。"], [8, "四(2)", "イ", "「本当にそうだろうか」は、直前の「写真で記録できるので、人間は感動した瞬間を忘れないで記憶に留められるようになった」という考えへの疑問。すぐあとで「写真を撮る行為があまりにもイージーになってしまったが故に、感動を閉じ込めようという意識がめっきり薄れてしまった」「忘れたくないという気持ちからシャッターを切るのではなく、撮ることだけで満足しがちになった」と理由を述べている。これと同じ内容のイ。"], [9, "四(3)", "エ", "筆者は、人の眼は見たいものしか見ないので「死角」がつねに存在すると述べ、だからこそ撮った写真をじっくり見て考えることで、目に映る世界以上のものを捉えられるとしている。"], [9, "四(4)", "ア", "「違和感」は、写真を撮ることと見ることを分けて考えない（先送りする）ことへの違和感。実際に体験したこと（感じたこと）と、写真になった画像との間にずれがあるから。"], [10, "四(5)", "Ⅰ ウ、Ⅱ ア、Ⅲ イ", "「記録」として撮った写真をプリントして見ることで、写真に捉えられたイメージと徹底的に向き合う（Ⅰ・ウ）。そうすることで新たな発見があり、体験が補われて、より鮮明な「記憶」となって定着する（Ⅱ・ア）。そのためには、自分の世界観や価値観に縛られず新しいことにひらかれた自由な場所を自分の中につくる（Ⅲ・イ）、つまり意図的に余白を残しておく必要がある。"], [10, "四(6)", "（例）つねに不確実だと認識し、撮った写真を徹底的に見ることで思考する時間を持続させる", "「豊かな感性を育てたい」の前の段落をまとめる。自分の見ている世界がつねに不確実（死角がある）と認識すること、写真を見て考える時間を持つこと、の2点を「写真」「思考」を使って30〜40字で書く。"], [13, "五(1)", "ウ", "貴音は「花をいける所作も審査対象」で、作品の差がないなら観客を惹き付けるパフォーマンスで差がついた、と分析している。春乃もそれに大いに頷いた。"], [13, "五(2)", "ア", "「ふふ……」は、台詞が飛んで父親にこっぴどく叱られたと言う貴音に対する春乃の反応。花いけバトルに真剣に向き合う貴音の姿に好意をもった気持ち。"], [13, "五(3)", "エ", "貴音は「間を置いて細く息を吐いて」から、舞台に立つ者の覚悟を語り始める。ずっと考えてきたことの答えを正確に、重みをもって伝えるために、一度心を落ち着かせた。"], [14, "五(4)", "Ⅰ エ、Ⅱ ア", "Ⅰ：台詞が飛んで父親にこっぴどく叱られた＝叱責された。Ⅱ：「これだけは（ゆずれない）」と言い、口調が低くなった。怒っているのではなく、何が起きても揺るがない強さ＝譲歩できないもの。"], [14, "五(5)", "（例）どのような舞台でも確固たる信念を持ち、観客のため心を尽くす必要がある", "貴音は「舞台に上がれば、観客に礼をもって接し、技をもって魅せ、心を届けるように努める。板の上で何をしていてもそれは変わらない」と言っている。「舞台」「観客」「信念」を使って30〜35字にまとめる。"], [14, "五(6)", "ウ", "時間の経過とともに、春乃が貴音の話に引き込まれ、魅了されていく様子を、短い一文を重ねて印象的に描いている。"], [15, "六(1)", "イ", "語中・語尾の「は・ひ・ふ・へ・ほ」は「わ・い・う・え・お」に、「ゐ」は「い」に直す。なほ→なお、言ひ→いい、やまざりける はそのまま。「なおいいやまざりける」。"], [15, "六(2)", "エ", "何度も問われて「うち腹立ちて（腹を立てて）」答えたのは、「くさめくさめ」と言い続けていた尼。"], [15, "六(3)", "ア", "「かくまじなはねば死ぬるなり」＝このようにまじないをしないと、（くしゃみをすると）死んでしまうのだ。"], [16, "六(4)", "イ", "尼は、育てた比叡山の稚児が「今もくしゃみをしていたら」と案じて、ずっとまじないを唱えていた。作者はその深い愛情を「ありがたい志」と述べている。"], [16, "六(5)(a)", "ア", "「鼻ひて」は「くしゃみをして」。「鼻ひる」＝くしゃみをする。"], [16, "六(5)(b)", "ウ", "「父母愛子之心無所不至」は、「父母の子を愛する心は至らざる所無し」と書き下す（返り点に従い、愛→子、無→所→至の順を入れかえる）。"], [16, "六(5)(c)", "（例）育てた子が死んでしまわないように強く願う気持ち", "尼は、くしゃみをすると死ぬと信じられていたので、育てた子が死なないようにと、遠くでまじないを唱え続けた。「……ないように」の形で20〜25字。"], [17, "七", "作文（正答表の解答例を参照）", "条件：①二段落構成・十行以内、②前段でAかBを選び理由、③後段で前段に関連させ自分の体験（見聞きしたことも可）を入れて考えを書く。解答例A：「過去から積み上げた歴史と伝統は大切」と理由を述べ、後段で古着や古本、長く使うバッグの例。解答例B：「新たなものを利用することで今より快適に暮らせる」と理由を述べ、後段で父の電気カミソリや母の洗濯機の例。AでもBでも採点に影響しない。"]], "2026_math": [[2, "1(1)①", "23", "かけ算を先に計算する。4×(−3)=−12 なので、11−(−12)=11+12=23。"], [2, "1(1)②", "−a+b", "分配法則でかっこを外す。8a−14b−9a+15b。a どうし、b どうしをまとめて −a+b。"], [2, "1(1)③", "−√3", "6/√3 は分母を有理化して 6√3/3=2√3。√27=3√3。2√3−3√3=−√3。"], [2, "1(2)①", "ウ", "縦は x+3、横は x−2 なので、面積は (x+3)(x−2)=x²+x−6。"], [2, "1(2)②", "あ 8", "x²+x−6=66 より x²+x−72=0。(x+9)(x−8)=0 で x=−9, 8。長さなので x>0（さらに横 x−2>0）から x=8。"], [3, "1(3)①", "エ", "円周角は、同じ弧に対する中心角の半分。「2倍」が誤りなので エ。ア・イ・ウは正しい性質。"], [3, "1(3)②", "いう 48", "BD は直径なので ∠BAD=90°。△ABD で ∠ABD=180°−90°−42°=48°。∠ACD と ∠ABD は同じ弧 AD に対する円周角なので等しく、x=48°。"], [3, "1(4)①", "えお 14", "表1の「16回以上20回未満」の累積度数は、20回未満の人数。表2も20で階級が区切れているので、表2の 20回未満を足すと 2+3+2+7=14人。"], [3, "1(4)②", "かき 23", "25人の第3四分位数は、大きい方の12人（14番目〜25番目）の中央値なので、19番目と20番目の平均。表2から 20回未満が14人、23回未満が17人、26回未満が21人なので、19・20番目は23回以上26回未満。表1から24回以上は 3+2=5人（21〜25番目）なので、18〜20番目は23回以上24回未満、つまり23回。よって第3四分位数は23回。"], [4, "1(5)①", "く 3", "順序の何マス目で止まるかを書き出すと、1→D、2→E、3→D、4→C、5→B、6→A。1点（BかD）になるのは 1, 3, 5 の目で 3通り。"], [4, "1(5)②", "けこ 3/4", "順序の n マス目の点数は、奇数番目（D,D,B,B,D,D）がすべて1点、偶数番目は2点か3点。合計が3点未満（2点）になるのは、1回目も2回目も1点のときだけ。1回目が奇数の目（3通り）で、2回目に偶数の目（3通り）を出すと、奇数＋偶数で奇数番目に止まり1点になる。よって合計2点は 3×3=9通り。3点以上は 36−9=27通り なので、27/36=3/4。"], [4, "1(6)①", "さ 8", "xy=8 となる整数の組を数える。x=±1, ±2, ±4, ±8 の8通りで、y もそれぞれ整数になる。"], [4, "1(6)②", "しす −8、せそ −2", "x<0 では、x が大きくなると y は小さくなる（減少）。x=−4 のとき y=−2、x=−1 のとき y=−8。よって −8≦y≦−2。"], [5, "1(7)①", "た 1", "ねじれの位置は「平行でなく、交わらない」辺。AB と交わらない辺は CD だけで、CD は AB と平行でもないので1本。"], [5, "1(7)②", "作図（正答表の図を参照）", "足りないのは、辺 AC でつながる面 △ABC。B の位置は「A から AB の長さ」「C から CB の長さ」の2つの円の交点になる。①コンパスで、展開図の右の AB の長さをとり、A を中心に円をかく。②下の CB の長さをとり、C を中心に円をかく。③2つの円の交点（辺 AC の左側）を B とし、A・C と結ぶ。"], [6, "2(1)", "ち 8", "y=1/2×(−4)²=8。"], [6, "2(2)", "つ 1、てと 12", "B の y 座標は 1/2×6²=18。傾きは (18−8)/(6−(−4))=10/10=1。y=x+b に A(−4, 8) を代入して b=12。"], [7, "2(3)", "なに −6、ぬ 2、ね 8", "C(0, 12) なので OC=12。P(t, t²/2)、Q(t, t+12) とすると PQ=|t+12−t²/2|=12。①t+12−t²/2=12 のとき t²−2t=0 で t=0, 2。②t²/2−t−12=12 のとき t²−2t−48=0、(t−8)(t+6)=0 で t=8, −6。小さい順に −6, 0, 2, 8。"], [8, "3(1)", "(a) ア、(b) エ、(c) オ", "円の接線は、接点を通る半径と垂直。△AOD と △AOF が合同なら、対応する辺 AD=AF がいえる。"], [9, "3(2)", "証明（正答表を参照）", "△AOD と △AOF で、①接線と半径は垂直なので ∠ADO=∠AFO=90°、②円の半径なので OD=OF、③AO は共通。①②③より、直角三角形の斜辺と他の1辺がそれぞれ等しいので △AOD≡△AOF。合同な図形の対応する辺なので AD=AF。"], [9, "3(3)", "の 3、は 6、ひふ 10（3√6/10 cm）", "∠OFG=90° なので、3点 O, F, G を通る円は OG が直径。・接線の長さ：周の半分 s=(6+6+4)/2=8 より CF=s−AB=2。・BG は ∠B の二等分線なので AG:GC=AB:BC=6:4 となり、CG=6×4/10=12/5。よって FG=12/5−2=2/5。・内接円の半径 r：A から BC への高さは √(6²−2²)=4√2、面積は 8√2。r=面積÷s=√2。・OG²=r²+FG²=2+4/25=54/25 より OG=3√6/5。半径はその半分で 3√6/10 cm。"], [11, "4(1)", "へ 1、ほ 2", "△ODF∽△BCF なので OF:FB=OD:BC=3:6=1:2。"], [11, "4(2)", "ま 1", "O(0, 0) と B(6, 6) を通るので傾きは 6÷6=1。"], [11, "4(3)", "みむ −2、め 6", "C(0, 6)、D(3, 0) を通るので、傾きは (0−6)÷(3−0)=−2、切片は6。"], [11, "4(4)", "も 3、や 1、ゆ 2（PQ=3−d/2）", "折り返しで ∠BPN=∠A=90°、PN=AN=3、BP=BA=6。△PQN と △BRP は直角三角形で、∠QPN=∠RBP なので相似。相似比は PN:BP=3:6=1:2。BR=6−d なので PQ=BR/2=3−d/2。"], [11, "4(5)", "よ 6、ら 2（PR=6−2d）", "同じ相似から QN:RP=1:2。QN=3−d なので PR=2(3−d)=6−2d。PQ+PR=6 に代入すると 9−5d/2=6 で d=6/5。"], [11, "4(6)", "り 9、る 8", "N′A=6×1/4=3/2、P′N′=3/2、BP′=6 なので、相似比は 3/2:6=1:4。P′Q′=(6−d)/4、Q′N′=9/2−d より P′R′=4(9/2−d)=18−4d。P′Q′+P′R′=6 から (6−d)/4+18−4d=6、両辺を4倍して 6−d+72−16d=24、17d=54、d=54/17。CR′=d=54/17、R′B=6−54/17=48/17 なので、CR′:R′B=54:48=9:8。"]], "2026_science": [[2, "1(1)", "ウ", "振動数が少ないほど低い音、多いほど高い音。ア：空気中の音の速さは約340m/s（30万km/sは光の速さ）。イ：音は水などの液体中も伝わる。エ：振幅が大きいほど音は大きい。"], [2, "1(2)", "エ", "混合物は、沸点や融点が決まった温度にならない。ア：状態変化で粒子の数は変わらない（粒子の間隔が変わる）。イ：固体→液体の温度は融点。ウ：水は固体（氷）になると体積が大きくなる。"], [2, "1(3)", "ウ", "分解者（菌類・細菌類など）は、死がいや排出物の有機物をとりこみ、二酸化炭素や水などの無機物に分解する。"], [2, "1(4)", "ウ", "◎はくもり（○は快晴、①のように線が入ると晴れ）。矢羽根は風が吹いてくる方向に立てるので、北東の風。"], [4, "2(1)", "ア", "噴火で噴き出すのは「火山噴出物」（火山ガス・火山灰・溶岩など）。災害のおそれのある区域や避難場所を示した地図は「ハザードマップ」。柱状図は地層の重なりを表す図。"], [4, "2(2)", "ウ", "長石は無色鉱物、輝石は有色鉱物。ア：火山灰には何種類もの鉱物がふくまれる。イ：セキエイは無色（白色）で不規則な形。エ：観察するときは水で洗い、細かい粒を流す。"], [4, "2(3)", "イ", "水を多くすると、流れやすい（ねばりけが弱い）マグマになり、モデルBのように平たく広がる。花こう岩・流紋岩になるのはねばりけが強いマグマ。"], [4, "2(4)", "Ⅰ群 ア、Ⅱ群 ウ", "図4の火山Cは、水平に約120kmで高さ約4000m。図5の火山Dは、約12kmで約1100m。山頂の高さの割合が小さく傾斜がゆるやかなのは C。ゆるやかな火山はねばりけの弱いマグマ（モデルB）でできるので、噴火は比較的おだやか。"], [6, "3(1)", "エ", "右手の4本の指を電流の向きに合わせてコイルをにぎると、親指の向きがコイル内部の磁界の向き。図4の電流の向きでは、コイル内部の磁界は下向き（エ）。コイルの外側では磁界の向きが逆になり、ぐるっと一周する形になる。"], [6, "3(2)", "B、E", "磁石に近づけたまま「動かさない」と、コイル内部の磁界が変化しないので電流は流れない（電磁誘導が起きない）。"], [6, "3(3)", "イ、エ", "「極だけ」を変え、動かし方（近づける・遠ざける）は同じものを比べる。A（N極・近づける）とD（S極・近づける）、C（N極・遠ざける）とF（S極・遠ざける）。"], [6, "3(4)", "0.15 秒間", "電力＝電圧×電流＝3.0V×0.06A＝0.18W。電力量＝電力×時間 なので、時間＝0.027J÷0.18W＝0.15秒。"], [8, "4(1)", "ア", "脳とせきずいをまとめて中枢神経という。そこから枝分かれする感覚神経・運動神経は末しょう神経。"], [8, "4(2)", "エ", "光はレンズ（c）で屈折し、網膜（d）の上に像を結ぶ。e は視神経。"], [8, "4(3)", "3.6", "合図は「音」なので、記録Ⅱ（音）のTさんの反応時間 0.24秒を使う。クレーンは秒速15cmなので、15×0.24＝3.6cm。"], [8, "4(4)", "(a) カ、(b) キ", "(a)意識して起こす反応：皮膚（受けとる器官）→F→せきずい→D→脳→E→せきずい→G→筋肉。(b)熱いものから無意識に手を離すのは反射で、脳を通らない：F→せきずい→G。"], [10, "5(1)", "ア", "水に溶けて電流を通す物質は電解質。砂糖のように通さない物質は非電解質。"], [10, "5(2)", "ウ", "硫酸 H₂SO₄ は、水素イオン H⁺ 2個と硫酸イオン SO₄²⁻ 1個に電離する。電荷の合計が0になることも確認する。"], [10, "5(3)", "(a) ウ、(b) イ", "(a)硫酸の酸性の正体 H⁺（＋）は陰極へ移動し、青色リトマス紙を赤くするので、青色リトマス紙の陰極側（ウ）。(b)水酸化バリウムのアルカリ性の正体 OH⁻（－）は陽極へ移動し、赤色リトマス紙を青くするので、赤色リトマス紙の陽極側（イ）。"], [10, "5(4)", "イ", "硫酸に水酸化バリウムを加えると、硫酸バリウム（沈殿）と水ができ、イオンが減る。Cで緑（中性）になったので、6cm³まではイオンが減り電流は小さくなる。それ以上加えると、加えた Ba²⁺ と OH⁻ が残り、イオンが増えて電流は大きくなる。"], [12, "6(1)", "ウ", "イネ・トウモロコシ・ユリは単子葉類で葉脈は平行脈。アブラナは双子葉類で網状脈。"], [12, "6(2)", "イ", "マツ（裸子植物）は、雄花のりん片の花粉のうから出た花粉が、雌花の胚珠に直接ついて種子ができる。ア：種子になるのは胚珠（子房は果実）。ウ：イチョウは裸子植物で果実はできない。エ：花粉管は柱頭から胚珠へのびる。"], [12, "6(3)", "ウ、オ", "コケ植物は根・茎・葉の区別がなく、根のように見える仮根でからだを固定している（ウ）。胞子でふえ、胞子は湿った地面に落ちて発芽する（オ）。イ：飛ばすのは胞子のうではなく胞子。エ：維管束はない。カ：ひげ根ではなく、乾燥に弱い。"], [12, "6(4)", "x エ、y ウ、z イ", "アサガオは×が x だけ。アサガオは胞子をつくらないので x＝エ（胞子をつくる）。ヘゴ（シダ植物）は○が3つ：光合成・胞子・葉茎根の区別（y＝ウ）で、花粉はつくらない（z＝イ）。ゼニゴケは光合成と胞子の2つで合う。"], [14, "7(1)", "ウ", "炭酸水素ナトリウムを加熱すると二酸化炭素が出る（石灰水が白くにごる）。石灰石にうすい塩酸を加えても二酸化炭素が出る。アは水素、イはアンモニア、エは酸素。"], [14, "7(2)", "Na₂CO₃", "加熱後に残った白い物質は炭酸ナトリウム。2NaHCO₃→Na₂CO₃＋H₂O＋CO₂。水によく溶け、強いアルカリ性。"], [14, "7(3)", "ア", "試験管Aの口を少し下げるのは、発生した水（液体）が加熱部分に流れて試験管が割れるのを防ぐため。"], [14, "7(4)", "2.65 g", "表3より、2.00gを加熱すると最後は1.26gになる。質量の比は一定なので、4.20×1.26/2.00＝2.646 → 2.65g。"], [16, "8(1)", "エ", "図1の恒星O（北極星）を中心に星が回っているので、北の空。"], [16, "8(2)", "ウ", "星の年周運動は地球の公転による。ア：恒星は自分で光る。イ：距離はさまざま。エ：銀河などの集団をつくる。"], [16, "8(3)", "キ", "北の空の星は北極星を中心に反時計回りに、1時間で15°、1か月で30°（同じ時刻）動く。1か月後で1時間おそいので 30°＋15°＝45°。恒星Pから反時計回り（下向き）に45°なので キ。"], [16, "8(4)", "カ", "地球は北極側から見て反時計回り（西から東）に自転するので、地球儀は B の向きに回す。24時間＝86400秒を10秒で再現しているので、時間は 10/86400＝約1/8600 倍。"], [18, "9(1)", "作図（正答表の図を参照）", "A が B を押す力（作用、3N下向き）の反作用は、B が A を押す力。A と B の境目の点を作用点にして、上向きに方眼3目盛り（3N）の矢印をかく。"], [18, "9(2)(a)", "イ", "図2で、はかりPが 800g→700g になるのは糸を10cm引き上げたとき。その間 A は持ち上がっていない（30cmまでは目盛りが下がり続ける）ので、ばねの伸びは引き上げた距離と同じ 10cm。"], [18, "9(2)(b)", "ア", "30cm引いたとき目盛りが500gで止まるので、ここで A（300g＝3N）が浮く。ばねが A を引く力が仕事をするのは、残りの 10cm だけ。3N×0.1m＝0.3J。"], [18, "9(3)", "(a) イ、(b) エ", "実験1から、ばねは 1N（100g分）で10cm伸びる。20cm伸びたときばねの力は2N。この力は A と B の両方を上に引くので、はかりP＝300−200＝100g、はかりQ＝500−200＝300g。"]], "2026_social": [[2, "1(1)", "ア", "縄文時代につくられたのは土偶（ア）。イは弥生時代の銅鐸、ウは古墳時代の埴輪、エは中国の殷の青銅器など。"], [2, "1(2)", "ウ", "資料1は四国の太平洋側など海岸線に沿って分布し、地図記号は「自然災害伝承碑」。資料2は高知市の津波避難タワー。共通するのは津波。"], [3, "1(3)", "イ", "世界遺産条約を採択し、教育・科学・文化の協力を通じて平和をめざす国連の専門機関は UNESCO（国連教育科学文化機関）。WTO は世界貿易機関、WHO は世界保健機関。"], [3, "1(4)", "ウ", "仙台七夕まつりの来客数 203.6万人は、青森ねぶた祭 98万人の2倍（196万人）以上。経済効果は青森 306億円＞仙台 195億円。ア：秋田竿燈は122万人で94億円。イ：盛岡さんさは青森より少ない。エ：秋田の経済効果94億円は福島28億円の5倍未満。オ：山形の減少は約28万人。"], [4, "2(1)", "エ", "天平文化（奈良時代）は、聖武天皇が伝染病や災害から国を守ろうとした東大寺の大仏（エ）。アは飛鳥時代の広隆寺の弥勒菩薩、イは飛鳥文化の仏像、ウは平安時代の平等院鳳凰堂の阿弥陀如来像（国風文化）。"], [5, "2(2)", "ウ", "源頼朝は、対立した弟の源義経をとらえることを口実に、国ごとに守護、荘園や公領ごとに地頭を置くことを朝廷に認めさせた（1185年）。六波羅探題は承久の乱の後に置かれた。"], [5, "2(3)", "ア", "南蛮貿易では、日本からは主に銀が持ち出された。鉄砲・火薬・ガラス製品などは日本に入ってきたもの。"], [5, "2(4)", "（例）営業を独占する株仲間を認める代わりに税", "田沼意次は、商人の同業者組合である株仲間を認めて営業の独占を許し、その代わりに税（営業税）を納めさせた。「独占」「株仲間」の2語を必ず入れる。"], [5, "2(5)", "イ", "開国後の物価上昇などの混乱の中、民衆は「世直し」を期待して一揆や打ちこわしを起こした。「ええじゃないか」の騒ぎも起きた。15代将軍徳川慶喜は政権を朝廷に返す大政奉還を行った（1867年）。版籍奉還は明治政府が土地と人民を天皇に返させたもの。"], [6, "3(1)", "ウ", "国際連盟は1920年に成立。1912年（中華民国成立）〜1941年（日ソ中立条約）の期間に含まれる。"], [7, "3(2)", "ア", "日清戦争（1894年）のきっかけは、朝鮮で起きた甲午農民戦争。朝鮮政府が清に援軍を求め、日本も出兵して両国が対立した。イは日中戦争、ウはアヘン戦争、エは義和団事件。"], [7, "3(3)", "Ⅰ イ、Ⅱ ウ", "米騒動の責任をとって寺内内閣が退陣すると、立憲政友会の原敬が首相となり、大部分の閣僚を政党の党員が占める本格的な政党内閣ができた（1918年）。"], [7, "3(4)", "エ→ア→イ→ウ", "エ：ペリー来航（1853年）→ア：南北戦争（1861年）→イ：アメリカの第一次世界大戦参戦（1917年）→ウ：ワシントン会議（1921〜22年）。"], [7, "3(5)", "エ", "日本人初のノーベル賞（物理学賞）は湯川秀樹（1949年）。佐藤栄作は平和賞、川端康成と大江健三郎は文学賞。"], [8, "4(1)", "Ⅰ ア、Ⅱ ウ、Ⅲ イ", "緯度は南北それぞれ90度、経度は東西それぞれ180度まで。正反対（対せき点）は、緯度は北と南を入れかえ同じ数値、経度は 180−30＝150 で東西を入れかえる。北緯30度・東経30度 → 南緯30度・西経150度。"], [8, "4(2)", "都市 B、自然 ア", "年平均気温が−10.1℃で、夏の短い間だけ気温が0℃を少しこえる寒帯（ツンドラ気候）。北極海に近い B の都市。夏の間だけ地表がとけて、こけ類が育つ。"], [9, "4(3)", "ウ", "19世紀以降、鉄鋼や自動車工業は五大湖周辺（地図中の あ）で発展した。20世紀後半からはサンベルトで先端技術産業が発展し、特にサンフランシスコ近くのシリコンバレー（い の付近）にICT関連企業が集まっている。"], [9, "4(4)", "プランテーション", "植民地時代に開かれた、輸出用の作物を大規模に栽培する大農園。Yはケニアで、茶の栽培がさかん。"], [9, "4(5)", "ウ", "2010年のGDP上位2か国は日本とドイツ。どちらもエネルギー国内供給量は減っている。ア：日本は人口が減少。イ：出生率が高い順（インド→メキシコ→ドイツ→日本）と増加額の順は一致しない。エ：ドイツは人口が増えたが出生率8.5で10未満。"], [10, "5(1)", "イ", "瀬戸内は中国山地と四国山地にはさまれ、太平洋や日本海から吹く湿った季節風がさえぎられるため、雨が少ない。そのため讃岐平野では、水不足に備えたため池が多い。マングローブは熱帯の海岸の林。"], [10, "5(2)", "エ", "九州南部には、火山の噴出物が厚く積もったシラス台地が広がる。シラスは水を通しやすく、水をたくわえにくいので、水の確保が難しかった。ロームは関東地方に広がる火山灰の赤土。"], [10, "5(3)", "（例）地価が高いため、土地を有効利用する", "都心は地価が高いので、限られた土地を有効に使うために高層ビルが建てられる。「地価」「利用」の2語を入れて20字以内。"], [11, "5(4)", "ウ、オ", "ウ：新屋敷町付近に裁判所（Ⅹ）や消防署、市役所などの記号が集まっている。オ：縮尺2万5千分の1で約9cmなので、9×25000＝225000cm＝2.25km。ア：紀伊田辺駅は紀伊新庄駅から見て北西。イ：南新町・北新町付近に多いのは神社（⛩）ではなく寺院（卍）の記号。エ：A・B間の点線は道（小道）で、周囲より標高が低い位置を結んだ線ではない（等高線で確かめる）。"], [12, "5(5)", "イ", "地形図では、高等学校の地図記号（⊗）と小・中学校（文）は区別されているので、資料1でも高等学校かどうか判別できる。よってイが誤り。"], [13, "6(1)", "C", "Ⅳは「海外向け」で「個人的な取り組み」。フェアトレード商品の購入やNGOのボランティアは、個人が海外を支援する取り組み。Aは国内・個人、Bは国内・公的、Dは海外・公的。"], [13, "6(2)", "オ", "4つの略称は PKO（平和維持活動）、NPT（核拡散防止条約）、ODA（政府開発援助）、UNHCR（国連難民高等弁務官事務所）。どれにも使われない文字は Y。"], [15, "7(1)", "オ", "消費税は、税率が8%から10%に上がり（2019年）軽減税率がある資料2で、グラフでは1989年に始まり急に増えた Y。所得税は、収入が多いほど税率が高くなる累進課税の資料1で、長く最大の税収だった X。資料3は相続税で Z。"], [15, "7(2)", "エ", "A：電気・ガス・水道などの公共料金は、国や地方公共団体が決定・認可する（公正取引委員会ではない）ので誤り。B：クーリング・オフは訪問販売など特定の取引だけが対象で、全ての契約ではないので誤り。"], [15, "7(3)", "ウ", "「効率」（むだがない）と「公正」（関係者の立場や意見の公平さ）の両方を考えた方法。混雑状況の発信で観光客を分散させ、入場料の一部を環境保全に使うのは、住民と観光客の両方に配慮している。ア：むだが多い。イ：住民だけを優先。エ：優劣を決めるのは合意にならない。"], [16, "8(1)", "ウ", "大日本帝国憲法では主権は天皇にあった。絵は言論を取りしまる様子なので、実現していないのは表現の自由（日本国憲法第21条）。"], [16, "8(2)", "（例）立法権、行政権、司法権が互いに抑制し合い、均衡", "国会（立法権）、内閣（行政権）、裁判所（司法権）が互いに抑制し合い、均衡を保つことで、権力の集中や乱用を防ぐ。"], [17, "8(3)", "オ", "国の政策は全国的な規模の施策を担う（ろ）で、事例は法律の改正（事例B）。地方自治体の政策は住民自治に基づき住民の自発的努力が大切（い）で、事例は地域の高齢者の見守り（事例A）。「は」はNPOの説明。"]]};

const $=i=>document.getElementById(i);
let y=null,sb=null,mode=1,sp=0,Z=1;const LD={};
function load(f){return LD[f]||(LD[f]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=f+'.js?v=2611272014';s.onload=res;s.onerror=()=>{delete LD[f];rej()};document.head.appendChild(s)}))}
YS.forEach(k=>{const b=document.createElement('button');b.className='Y';b.innerHTML=k+'<br><small>'+M[k].w.replace('令和','R')+'</small>';b.style.lineHeight='1.1';b.dataset.k=k;b.onclick=()=>pick(k,null);$('ry').appendChild(b)});
SUB.forEach(([k,l])=>{const b=document.createElement('button');b.className=k;b.textContent=l;b.dataset.k=k;b.onclick=()=>pick(null,k);$('rb').appendChild(b)});
function pick(a,b){if(a)y=a;if(b)sb=b;sp=0;$('xp').style.display='none';render(true)}
function ttl(){return M[y].w+'年度（'+y+'）'+SUB.find(x=>x[0]==sb)[1].replace(/^[^一-龠]+/,'')}
async function render(scroll){
 document.querySelectorAll('#ry button').forEach(b=>b.classList.toggle('on',b.dataset.k==y));
 document.querySelectorAll('#rb button').forEach(b=>b.classList.toggle('on',b.dataset.k==sb));
 if(y){$('pdfrow').style.display='';$('pdfa').href='chiba_kakomon_set_'+y+'.pdf';$('pdfa').textContent='🖨 '+M[y].w+'年度の印刷用カコモンセット（PDF）'}
 if(!y||!sb)return;
 const rd=$('rd');rd.style.display='flex';$('msg').style.display='none';rd.className=sb;
 const key=y+'_'+sb;$('col').innerHTML="<p id='tt'>読み込み中…</p>";$('sp').innerHTML='';
 try{await load(key)}catch(_){$('col').innerHTML='<p id="tt">読み込みに失敗しました</p>';return}
 if(key!=y+'_'+sb)return;
 $('m1').classList.toggle('on',mode==1);$('m2').classList.toggle('on',mode==2);
 draw();if(scroll)rd.scrollIntoView();
}
function P(){return IMG[y+'_'+sb]}
const ansBtn="<button class='hi' onclick='showAns()'>✏️ 正答表・解答用紙を見る</button>";
function draw(){
 const p=P(),L=p.length;
 if(mode==1){$('col').style.display='';$('sp').style.display='none';$('pgr').style.display='none';
  $('col').innerHTML="<p id='tt'>"+ttl()+"（全"+L+"ページ）</p>"+p.map((s,i)=>"<div class='pw'><p class='pn'>"+(i+1)+" / "+L+"</p><img loading='lazy' src='"+s+"'>"+qb(i+1)+"</div>").join('')+"<div class='end'>"+ansBtn+"</div>";
 }else{$('col').style.display='none';$('sp').style.display='flex';$('pgr').style.display='flex';
  const n=Math.floor(L/2)+1;sp=Math.max(0,Math.min(sp,n-1));
  let a=sp==0?-1:2*sp-1,b=sp==0?0:2*sp;if(a>=L)a=-1;if(b>=L)b=-1;
  const rtl=sb=='japanese';let l=rtl?b:a,r=rtl?a:b;if(sp==0){l=rtl?-1:-1;r=0}
  const slot=(i,c)=>"<div class='sl "+c+"'>"+(i<0?"":"<img src='"+p[i]+"'>")+"</div>";
  $('sp').innerHTML=slot(l,'L')+slot(r,'R');
  const nums=[a,b].filter(x=>x>=0).map(x=>x+1).join('・');
  $('pgr').innerHTML="<div class='r1'>"+ttl()+"　"+nums+" / 全"+L+"ページ</div><div class='r2'><button class='ctl' id='pv'>"+(rtl?"次へ ◀":"◀ 前へ")+"</button><button class='ctl' id='nx'>"+(rtl?"▶ 前へ":"次へ ▶")+"</button>"+(sp==n-1?ansBtn:"")+"</div>"+[a,b].filter(x=>x>=0).map(x=>qb(x+1)).join('');
  $('pv').onclick=()=>{sp+=rtl?1:-1;draw()};$('nx').onclick=()=>{sp+=rtl?-1:1;draw()};
 }
}
async function showAns(){
 $('rd').style.display='none';const x=$('xp');x.style.display='block';x.className=sb;
 x.innerHTML="<div class='xbar'><button class='xb' onclick='back()'>◀ 問題にもどる</button><span class='xt'>"+ttl()+" 答え</span><span class='zm'>拡大<button class='ctl' onclick='zoom(-.25)'>−</button><button class='ctl' onclick='zoom(.25)'>＋</button></span></div><div class='xin'><p class='lg'>読み込み中…</p></div>";
 x.scrollIntoView();const key=y+'_'+sb;
 try{await load('a_'+key)}catch(_){x.querySelector('.xin').innerHTML='<p class="lg">読み込みに失敗しました</p>';return}
 const A=IMG[key+'_ans']||[],S=IMG[key+'_sheet']||[];
 const kx=K[key]||[];let h=(kx.length?"<h2 class='xh'>💡 設問ごとの答えと解説</h2>"+kx.map(r=>"<div class='it'><div class='q'>"+esc(r[1])+"</div><div class='a'>答え："+esc(r[2])+"</div><div class='e'>"+esc(r[3])+"</div></div>").join(''):'')+"<h2 class='xh'>✏️ 正答表（配点・採点上の注意つき）</h2><div class='aw'>"+A.map(u=>"<img class='ai' src='"+u+"'>").join('')+"</div>";
 h+="<h2 class='xh'>📝 解答用紙</h2>"+(S.length?"<p class='lg'>印刷して使うときは、上の「印刷用カコモンセット（PDF）」が便利です。</p><div class='aw'>"+S.map(u=>"<img class='ai' src='"+u+"'>").join('')+"</div>":"<p class='lg'>この年度は解答用紙の原本がありません。ノートに解答してください。</p>");
 h+="<p class='note'>※千葉県教育委員会公表の問題・正答表をもとにしています。</p><div style='text-align:center'><button class='xb' onclick='back()'>◀ 問題にもどる</button></div>";
 x.querySelector('.xin').innerHTML=h;zoom(0);
}
function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function qb(pg){const kx=(K[y+'_'+sb]||[]);const L=kx.map((r,i)=>[r,i]).filter(([r])=>r[0]==pg);if(!L.length)return '';return "<div class='qbs'><span>💡答え・解説</span>"+L.map(([r,i])=>"<button class='qbb' data-i='"+i+"' onclick='openQ("+i+")'>"+esc(r[1])+"</button>").join('')+"</div>"}
function openQ(i){const r=K[y+'_'+sb][i];document.querySelectorAll('.qbb').forEach(b=>b.classList.toggle('on',+b.dataset.i==i));$('qx').className=sb;$('qx').style.display='flex';$('qxt').textContent=r[1];$('qxb').innerHTML="<div class='a'>答え："+esc(r[2])+"</div><div class='e'>"+esc(r[3])+"</div>";document.body.classList.add('qo')}
function closeQ(){$('qx').style.display='none';document.body.classList.remove('qo');document.querySelectorAll('.qbb').forEach(b=>b.classList.remove('on'))}
function zoom(d){Z=Math.max(1,Math.min(3,Z+d));$('xp').style.setProperty('--z',Z)}
function back(){$('xp').style.display='none';$('rd').style.display='flex';$('rd').scrollIntoView()}
$('ga').onclick=showAns;
$('m1').onclick=()=>{mode=1;render()};$('m2').onclick=()=>{mode=2;sp=0;render()};
$('bk').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.addEventListener('keydown',e=>{if(mode!=2||!y||!sb||$('rd').style.display=='none')return;const r=sb=='japanese';if(e.key=='ArrowRight'){sp+=r?-1:1;draw()}if(e.key=='ArrowLeft'){sp+=r?1:-1;draw()}});
let tx=null;$('sp').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('sp').addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)<60)return;const r=sb=='japanese';sp+=(d<0)!==r?1:-1;draw()});
</script></body></html>
