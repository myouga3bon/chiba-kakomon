const M={"2021": {"w": "令和３", "s": {"japanese": {"n": 14, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 9, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2022": {"w": "令和４", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 12, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2023": {"w": "令和５", "s": {"japanese": {"n": 18, "a": 1, "sh": 1}, "math": {"n": 11, "a": 1, "sh": 1}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 1}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2024": {"w": "令和６", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 16, "a": 1, "sh": 1}}}, "2025": {"w": "令和７", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 15, "a": 1, "sh": 1}}}, "2026": {"w": "令和８", "s": {"japanese": {"n": 17, "a": 1, "sh": 2}, "math": {"n": 11, "a": 1, "sh": 2}, "english": {"n": 13, "a": 1, "sh": 1}, "science": {"n": 18, "a": 1, "sh": 2}, "social": {"n": 17, "a": 1, "sh": 1}}}};const K={"2026_english": [[4, "1 No.1", "D", "「何か飲み物はいかが？（Would you like something to drink?）」への返事なので、Yes, please.（はい、お願いします）。"], [4, "1 No.2", "B", "「チョコレートとイチゴ、どっちをのせる？」と聞かれているので、Strawberries are better.（イチゴがいい）。"], [4, "1 No.3", "C", "How often ～? は「どのくらいの頻度で」。頻度を答えている Twice a week.（週に2回）。"], [4, "2 No.1", "A", "友だちと連絡を取りたい（communicate）ときに押すのは、メッセージを送る「左上の四角」。左上は A。"], [4, "2 No.2", "A", "「壁に花を飾り（I put flowers on the wall）、ソファーにプレゼントを置いた」部屋。テーブルにはケーキとピザ。"], [4, "3 No.1", "A", "クリスは「新聞記者（newspaper writer）になりたい」と言っている。Write for a newspaper."], [4, "3 No.2", "C", "「今日は職員室のブラウン先生、明日から1週間は理科室のグリーン先生が保管」。質問は tomorrow なので理科室。"], [4, "4 ①", "C", "旅行に行かなかった理由は it was too expensive to go abroad（海外は高すぎた）＝お金が足りなかった。"], [4, "4 ②", "D", "she decided to visit some more places there（国内のもっと多くの場所を訪ねると決めた）＝日本をもっと旅行したい。"], [5, "5 (1)", "オ→ウ→イ→エ→ア", "I will go there by bus.「バスでそこへ行きます」。will の後は動詞の原形 go、場所 there、手段 by bus の順。"], [5, "5 (2)", "エ→オ→ウ→イ→ア", "I think the boy playing soccer is his brother.「サッカーをしている少年が彼の兄弟だと思う」。playing soccer が後ろから the boy を説明する（現在分詞の後置修飾）。"], [5, "5 (3)", "イ→オ→ア→エ→ウ", "Do you know what time the movie starts?「映画が何時に始まるか知っていますか」。疑問文が文の中に入る間接疑問は〈疑問詞＋主語＋動詞〉の語順。"], [6, "6", "解答例：I like our school because our teachers are nice. My English teacher is especially interesting. He always tries to make us laugh during class.（24語）", "条件は①特徴や魅力を「一つだけ」②詳しい説明や具体例を書く、③20〜30語。最初の文で魅力を一つ言い、次の文で具体例を2文ほど足すと条件を満たしやすい。2つ以上の魅力を並べると条件違反になるので注意。"], [8, "7(1) ①", "エ→ア→イ→ウ", "picture 1 はケンが今乗っているカゴ付きの自転車（エ）。picture 2 は最初の自転車で、木のフレームでペダルがなく足で地面をける（ア）。picture 3 は前輪が大きく、ペダルが前輪についている（イ）。picture 4 は1885年、同じ大きさの車輪とチェーン（ウ）。"], [8, "7(1) ②", "エ", "発表は自転車のデザインの移り変わりを順に説明している。「自転車のデザインが時代とともにどう変わってきたか知って驚いた」がまとめとして合う。アは「最初から同じデザイン」で本文と逆。"], [8, "7(1) ③", "エ", "1885年の自転車は the bike had a chain that effectively moved the back wheel, so it could move faster（チェーンが後輪を効率よく動かしたので速くなった）。so の前が理由。"], [10, "7(2) ①", "ア", "チラシの最初に for a more eco-friendly future（より環境にやさしい未来のために）とあり、明かりを消して電気を節約するイベント。「エネルギーを節約し環境を守る」。"], [10, "7(2) ②", "イ", "二人は「無理なくできることをする」「簡単だから続けられる」と話している。「変化を起こすカギは小さなことから始めること」が続く。"], [10, "7(2) ③", "エ", "時間は 7:00 p.m. から「2時間」明かりを消すだけなので、「一晩中続き朝早く終わる」は誤り。イ：ジェニの「5年前に始めた」（2025年の5年前＝2020年）は正しい。ウ：FINISH はブラジルのカルロスなので正しい。"], [12, "8 (1)", "イ", "下線部のあとで「雨が降ると、乾いた地面が色とりどりの花でいっぱいになる」と具体的に説明されている。"], [12, "8 (2)", "エ", "「このようにして（in this way）多くの砂漠の植物が乾いた場所で育ち生きていける」。種が雨を待って育ち、また種を落として次の雨を待つ、というしくみを説明した段落の最後（エ）に入る。"], [12, "8 (3)", "キ→ア→エ→キ", "①砂漠の花畑の写真（キ）→②数週間後、種だけが残った地面（ア）→③また育つ答え＝雨が降り芽が出る（エ）→④そのおかげできれいに育った花畑（キ）。同じ符号を2回使ってよい。"], [12, "8 (4)", "ウ", "最後の方の Even in harsh places, wonderful things can happen.／although life is difficult, there is always hope. と同じ内容。"], [13, "9 (1)", "ア", "スペリングビーを「聞いたことがない」と答えたあとなので、「それについて教えてくれる？」。スージーは Sure. と説明を始めている。"], [13, "9 (2)", "ア", "つづりを間違えた人は座る（sit down）ので、最後まで「立っている」人が勝ち。"], [13, "9 (3)", "イ", "この後「だから何度も練習する」と続くので、アメリカの生徒にとってもつづりは「それほど簡単ではない」。"], [13, "9 (4)", "エ", "つづりだけに興味をもたれると悲しい、と言っている。ノブも「海外で多くの人と話したい」と答えているので、「毎日英語を話す練習をすること」。"]], "2026_japanese": [[5, "一(1)", "エ", "坂井さんは、まず「ストレスの主な原因の一つに『情報の洪水』がある」と原因を示し、次に大量の情報が脳を混乱させるという内容を説明し、最後に「だから距離を置くことでストレス軽減になる」と結論を話している。"], [5, "一(2)", "イ", "坂井さんの「自分の生活を見直すという明確な目的があると成功しやすい」、杉田さんの「日常的に節度を守ってデジタル機器を使う習慣がつくといい」という話から、意義を考えて目的を決め、使用時間を決める方法が合う。いきなり大きく変えるのは難しい、とも言っている。"], [5, "一(3)", "ウ", "坂井さんは「実践することで、デジタル機器によるストレスと社会問題との関連についての検証もできる」と言っている。自分で取り組むことでストレスの原因を知り、実行の前後の変化を確かめられる、という理由。"], [6, "二(1)", "あ（てた）", "「宛てる」＝手紙などを送る相手として指定すること。"], [6, "二(2)", "まかな（う）", "「賄う」＝必要なものをととのえてまにあわせること。"], [6, "二(3)", "ほうこう", "「芳香」＝よい香り。「芳」は「かんばしい」とも読む。"], [6, "二(4)", "きゅうりょう", "「丘陵」＝なだらかな起伏が続く低い山地。"], [6, "三(1)", "果（たす）", "「約束を果たす」＝やりとげる。"], [6, "三(2)", "盛（り）", "「盛り上げる」。「盛」の形に注意。"], [6, "三(3)", "救護", "けが人や病人を助けて手当てをすること。「救」と「護」。"], [6, "三(4)", "花鳥", "「花鳥風月」＝自然の美しい風物。"], [8, "四(1)", "②", "①残す（五段）、②薄れ（「薄れる」下一段）、③切っ（五段）、④浮かぶ（五段）。活用の種類が異なるのは②。"], [8, "四(2)", "イ", "「本当にそうだろうか」は、直前の「写真で記録できるので、人間は感動した瞬間を忘れないで記憶に留められるようになった」という考えへの疑問。すぐあとで「写真を撮る行為があまりにもイージーになってしまったが故に、感動を閉じ込めようという意識がめっきり薄れてしまった」「忘れたくないという気持ちからシャッターを切るのではなく、撮ることだけで満足しがちになった」と理由を述べている。これと同じ内容のイ。"], [9, "四(3)", "エ", "筆者は、人の眼は見たいものしか見ないので「死角」がつねに存在すると述べ、だからこそ撮った写真をじっくり見て考えることで、目に映る世界以上のものを捉えられるとしている。"], [9, "四(4)", "ア", "「違和感」は、写真を撮ることと見ることを分けて考えない（先送りする）ことへの違和感。実際に体験したこと（感じたこと）と、写真になった画像との間にずれがあるから。"], [10, "四(5)", "Ⅰ ウ、Ⅱ ア、Ⅲ イ", "「記録」として撮った写真をプリントして見ることで、写真に捉えられたイメージと徹底的に向き合う（Ⅰ・ウ）。そうすることで新たな発見があり、体験が補われて、より鮮明な「記憶」となって定着する（Ⅱ・ア）。そのためには、自分の世界観や価値観に縛られず新しいことにひらかれた自由な場所を自分の中につくる（Ⅲ・イ）、つまり意図的に余白を残しておく必要がある。"], [10, "四(6)", "（例）つねに不確実だと認識し、撮った写真を徹底的に見ることで思考する時間を持続させる", "「豊かな感性を育てたい」の前の段落をまとめる。自分の見ている世界がつねに不確実（死角がある）と認識すること、写真を見て考える時間を持つこと、の2点を「写真」「思考」を使って30〜40字で書く。"], [13, "五(1)", "ウ", "貴音は「花をいける所作も審査対象」で、作品の差がないなら観客を惹き付けるパフォーマンスで差がついた、と分析している。春乃もそれに大いに頷いた。"], [13, "五(2)", "ア", "「ふふ……」は、台詞が飛んで父親にこっぴどく叱られたと言う貴音に対する春乃の反応。花いけバトルに真剣に向き合う貴音の姿に好意をもった気持ち。"], [13, "五(3)", "エ", "貴音は「間を置いて細く息を吐いて」から、舞台に立つ者の覚悟を語り始める。ずっと考えてきたことの答えを正確に、重みをもって伝えるために、一度心を落ち着かせた。"], [14, "五(4)", "Ⅰ エ、Ⅱ ア", "Ⅰ：台詞が飛んで父親にこっぴどく叱られた＝叱責された。Ⅱ：「これだけは（ゆずれない）」と言い、口調が低くなった。怒っているのではなく、何が起きても揺るがない強さ＝譲歩できないもの。"], [14, "五(5)", "（例）どのような舞台でも確固たる信念を持ち、観客のため心を尽くす必要がある", "貴音は「舞台に上がれば、観客に礼をもって接し、技をもって魅せ、心を届けるように努める。板の上で何をしていてもそれは変わらない」と言っている。「舞台」「観客」「信念」を使って30〜35字にまとめる。"], [14, "五(6)", "ウ", "時間の経過とともに、春乃が貴音の話に引き込まれ、魅了されていく様子を、短い一文を重ねて印象的に描いている。"], [15, "六(1)", "イ", "語中・語尾の「は・ひ・ふ・へ・ほ」は「わ・い・う・え・お」に、「ゐ」は「い」に直す。なほ→なお、言ひ→いい、やまざりける はそのまま。「なおいいやまざりける」。"], [15, "六(2)", "エ", "何度も問われて「うち腹立ちて（腹を立てて）」答えたのは、「くさめくさめ」と言い続けていた尼。"], [15, "六(3)", "ア", "「かくまじなはねば死ぬるなり」＝このようにまじないをしないと、（くしゃみをすると）死んでしまうのだ。"], [16, "六(4)", "イ", "尼は、育てた比叡山の稚児が「今もくしゃみをしていたら」と案じて、ずっとまじないを唱えていた。作者はその深い愛情を「ありがたい志」と述べている。"], [16, "六(5)(a)", "ア", "「鼻ひて」は「くしゃみをして」。「鼻ひる」＝くしゃみをする。"], [16, "六(5)(b)", "ウ", "「父母愛子之心無所不至」は、「父母の子を愛する心は至らざる所無し」と書き下す（返り点に従い、愛→子、無→所→至の順を入れかえる）。"], [16, "六(5)(c)", "（例）育てた子が死んでしまわないように強く願う気持ち", "尼は、くしゃみをすると死ぬと信じられていたので、育てた子が死なないようにと、遠くでまじないを唱え続けた。「……ないように」の形で20〜25字。"], [17, "七", "作文（正答表の解答例を参照）", "条件：①二段落構成・十行以内、②前段でAかBを選び理由、③後段で前段に関連させ自分の体験（見聞きしたことも可）を入れて考えを書く。解答例A：「過去から積み上げた歴史と伝統は大切」と理由を述べ、後段で古着や古本、長く使うバッグの例。解答例B：「新たなものを利用することで今より快適に暮らせる」と理由を述べ、後段で父の電気カミソリや母の洗濯機の例。AでもBでも採点に影響しない。"]], "2026_math": [[2, "1(1)①", "23", "かけ算を先に計算する。4×(−3)=−12 なので、11−(−12)=11+12=23。"], [2, "1(1)②", "−a+b", "分配法則でかっこを外す。8a−14b−9a+15b。a どうし、b どうしをまとめて −a+b。"], [2, "1(1)③", "−√3", "6/√3 は分母を有理化して 6√3/3=2√3。√27=3√3。2√3−3√3=−√3。"], [2, "1(2)①", "ウ", "縦は x+3、横は x−2 なので、面積は (x+3)(x−2)=x²+x−6。"], [2, "1(2)②", "あ 8", "x²+x−6=66 より x²+x−72=0。(x+9)(x−8)=0 で x=−9, 8。長さなので x>0（さらに横 x−2>0）から x=8。"], [3, "1(3)①", "エ", "円周角は、同じ弧に対する中心角の半分。「2倍」が誤りなので エ。ア・イ・ウは正しい性質。"], [3, "1(3)②", "いう 48", "BD は直径なので ∠BAD=90°。△ABD で ∠ABD=180°−90°−42°=48°。∠ACD と ∠ABD は同じ弧 AD に対する円周角なので等しく、x=48°。"], [3, "1(4)①", "えお 14", "表1の「16回以上20回未満」の累積度数は、20回未満の人数。表2も20で階級が区切れているので、表2の 20回未満を足すと 2+3+2+7=14人。"], [3, "1(4)②", "かき 23", "25人の第3四分位数は、大きい方の12人（14番目〜25番目）の中央値なので、19番目と20番目の平均。表2から 20回未満が14人、23回未満が17人、26回未満が21人なので、19・20番目は23回以上26回未満。表1から24回以上は 3+2=5人（21〜25番目）なので、18〜20番目は23回以上24回未満、つまり23回。よって第3四分位数は23回。"], [4, "1(5)①", "く 3", "順序の何マス目で止まるかを書き出すと、1→D、2→E、3→D、4→C、5→B、6→A。1点（BかD）になるのは 1, 3, 5 の目で 3通り。"], [4, "1(5)②", "けこ 3/4", "順序の n マス目の点数は、奇数番目（D,D,B,B,D,D）がすべて1点、偶数番目は2点か3点。合計が3点未満（2点）になるのは、1回目も2回目も1点のときだけ。1回目が奇数の目（3通り）で、2回目に偶数の目（3通り）を出すと、奇数＋偶数で奇数番目に止まり1点になる。よって合計2点は 3×3=9通り。3点以上は 36−9=27通り なので、27/36=3/4。"], [4, "1(6)①", "さ 8", "xy=8 となる整数の組を数える。x=±1, ±2, ±4, ±8 の8通りで、y もそれぞれ整数になる。"], [4, "1(6)②", "しす −8、せそ −2", "x<0 では、x が大きくなると y は小さくなる（減少）。x=−4 のとき y=−2、x=−1 のとき y=−8。よって −8≦y≦−2。"], [5, "1(7)①", "た 1", "ねじれの位置は「平行でなく、交わらない」辺。AB と交わらない辺は CD だけで、CD は AB と平行でもないので1本。"], [5, "1(7)②", "作図（正答表の図を参照）", "足りないのは、辺 AC でつながる面 △ABC。B の位置は「A から AB の長さ」「C から CB の長さ」の2つの円の交点になる。①コンパスで、展開図の右の AB の長さをとり、A を中心に円をかく。②下の CB の長さをとり、C を中心に円をかく。③2つの円の交点（辺 AC の左側）を B とし、A・C と結ぶ。"], [6, "2(1)", "ち 8", "y=1/2×(−4)²=8。"], [6, "2(2)", "つ 1、てと 12", "B の y 座標は 1/2×6²=18。傾きは (18−8)/(6−(−4))=10/10=1。y=x+b に A(−4, 8) を代入して b=12。"], [7, "2(3)", "なに −6、ぬ 2、ね 8", "C(0, 12) なので OC=12。P(t, t²/2)、Q(t, t+12) とすると PQ=|t+12−t²/2|=12。①t+12−t²/2=12 のとき t²−2t=0 で t=0, 2。②t²/2−t−12=12 のとき t²−2t−48=0、(t−8)(t+6)=0 で t=8, −6。小さい順に −6, 0, 2, 8。"], [8, "3(1)", "(a) ア、(b) エ、(c) オ", "円の接線は、接点を通る半径と垂直。△AOD と △AOF が合同なら、対応する辺 AD=AF がいえる。"], [9, "3(2)", "証明（正答表を参照）", "△AOD と △AOF で、①接線と半径は垂直なので ∠ADO=∠AFO=90°、②円の半径なので OD=OF、③AO は共通。①②③より、直角三角形の斜辺と他の1辺がそれぞれ等しいので △AOD≡△AOF。合同な図形の対応する辺なので AD=AF。"], [9, "3(3)", "の 3、は 6、ひふ 10（3√6/10 cm）", "∠OFG=90° なので、3点 O, F, G を通る円は OG が直径。・接線の長さ：周の半分 s=(6+6+4)/2=8 より CF=s−AB=2。・BG は ∠B の二等分線なので AG:GC=AB:BC=6:4 となり、CG=6×4/10=12/5。よって FG=12/5−2=2/5。・内接円の半径 r：A から BC への高さは √(6²−2²)=4√2、面積は 8√2。r=面積÷s=√2。・OG²=r²+FG²=2+4/25=54/25 より OG=3√6/5。半径はその半分で 3√6/10 cm。"], [11, "4(1)", "へ 1、ほ 2", "△ODF∽△BCF なので OF:FB=OD:BC=3:6=1:2。"], [11, "4(2)", "ま 1", "O(0, 0) と B(6, 6) を通るので傾きは 6÷6=1。"], [11, "4(3)", "みむ −2、め 6", "C(0, 6)、D(3, 0) を通るので、傾きは (0−6)÷(3−0)=−2、切片は6。"], [11, "4(4)", "も 3、や 1、ゆ 2（PQ=3−d/2）", "折り返しで ∠BPN=∠A=90°、PN=AN=3、BP=BA=6。△PQN と △BRP は直角三角形で、∠QPN=∠RBP なので相似。相似比は PN:BP=3:6=1:2。BR=6−d なので PQ=BR/2=3−d/2。"], [11, "4(5)", "よ 6、ら 2（PR=6−2d）", "同じ相似から QN:RP=1:2。QN=3−d なので PR=2(3−d)=6−2d。PQ+PR=6 に代入すると 9−5d/2=6 で d=6/5。"], [11, "4(6)", "り 9、る 8", "N′A=6×1/4=3/2、P′N′=3/2、BP′=6 なので、相似比は 3/2:6=1:4。P′Q′=(6−d)/4、Q′N′=9/2−d より P′R′=4(9/2−d)=18−4d。P′Q′+P′R′=6 から (6−d)/4+18−4d=6、両辺を4倍して 6−d+72−16d=24、17d=54、d=54/17。CR′=d=54/17、R′B=6−54/17=48/17 なので、CR′:R′B=54:48=9:8。"]], "2026_science": [[2, "1(1)", "ウ", "振動数が少ないほど低い音、多いほど高い音。ア：空気中の音の速さは約340m/s（30万km/sは光の速さ）。イ：音は水などの液体中も伝わる。エ：振幅が大きいほど音は大きい。"], [2, "1(2)", "エ", "混合物は、沸点や融点が決まった温度にならない。ア：状態変化で粒子の数は変わらない（粒子の間隔が変わる）。イ：固体→液体の温度は融点。ウ：水は固体（氷）になると体積が大きくなる。"], [2, "1(3)", "ウ", "分解者（菌類・細菌類など）は、死がいや排出物の有機物をとりこみ、二酸化炭素や水などの無機物に分解する。"], [2, "1(4)", "ウ", "◎はくもり（○は快晴、①のように線が入ると晴れ）。矢羽根は風が吹いてくる方向に立てるので、北東の風。"], [4, "2(1)", "ア", "噴火で噴き出すのは「火山噴出物」（火山ガス・火山灰・溶岩など）。災害のおそれのある区域や避難場所を示した地図は「ハザードマップ」。柱状図は地層の重なりを表す図。"], [4, "2(2)", "ウ", "長石は無色鉱物、輝石は有色鉱物。ア：火山灰には何種類もの鉱物がふくまれる。イ：セキエイは無色（白色）で不規則な形。エ：観察するときは水で洗い、細かい粒を流す。"], [4, "2(3)", "イ", "水を多くすると、流れやすい（ねばりけが弱い）マグマになり、モデルBのように平たく広がる。花こう岩・流紋岩になるのはねばりけが強いマグマ。"], [4, "2(4)", "Ⅰ群 ア、Ⅱ群 ウ", "図4の火山Cは、水平に約120kmで高さ約4000m。図5の火山Dは、約12kmで約1100m。山頂の高さの割合が小さく傾斜がゆるやかなのは C。ゆるやかな火山はねばりけの弱いマグマ（モデルB）でできるので、噴火は比較的おだやか。"], [6, "3(1)", "エ", "右手の4本の指を電流の向きに合わせてコイルをにぎると、親指の向きがコイル内部の磁界の向き。図4の電流の向きでは、コイル内部の磁界は下向き（エ）。コイルの外側では磁界の向きが逆になり、ぐるっと一周する形になる。"], [6, "3(2)", "B、E", "磁石に近づけたまま「動かさない」と、コイル内部の磁界が変化しないので電流は流れない（電磁誘導が起きない）。"], [6, "3(3)", "イ、エ", "「極だけ」を変え、動かし方（近づける・遠ざける）は同じものを比べる。A（N極・近づける）とD（S極・近づける）、C（N極・遠ざける）とF（S極・遠ざける）。"], [6, "3(4)", "0.15 秒間", "電力＝電圧×電流＝3.0V×0.06A＝0.18W。電力量＝電力×時間 なので、時間＝0.027J÷0.18W＝0.15秒。"], [8, "4(1)", "ア", "脳とせきずいをまとめて中枢神経という。そこから枝分かれする感覚神経・運動神経は末しょう神経。"], [8, "4(2)", "エ", "光はレンズ（c）で屈折し、網膜（d）の上に像を結ぶ。e は視神経。"], [8, "4(3)", "3.6", "合図は「音」なので、記録Ⅱ（音）のTさんの反応時間 0.24秒を使う。クレーンは秒速15cmなので、15×0.24＝3.6cm。"], [8, "4(4)", "(a) カ、(b) キ", "(a)意識して起こす反応：皮膚（受けとる器官）→F→せきずい→D→脳→E→せきずい→G→筋肉。(b)熱いものから無意識に手を離すのは反射で、脳を通らない：F→せきずい→G。"], [10, "5(1)", "ア", "水に溶けて電流を通す物質は電解質。砂糖のように通さない物質は非電解質。"], [10, "5(2)", "ウ", "硫酸 H₂SO₄ は、水素イオン H⁺ 2個と硫酸イオン SO₄²⁻ 1個に電離する。電荷の合計が0になることも確認する。"], [10, "5(3)", "(a) ウ、(b) イ", "(a)硫酸の酸性の正体 H⁺（＋）は陰極へ移動し、青色リトマス紙を赤くするので、青色リトマス紙の陰極側（ウ）。(b)水酸化バリウムのアルカリ性の正体 OH⁻（－）は陽極へ移動し、赤色リトマス紙を青くするので、赤色リトマス紙の陽極側（イ）。"], [10, "5(4)", "イ", "硫酸に水酸化バリウムを加えると、硫酸バリウム（沈殿）と水ができ、イオンが減る。Cで緑（中性）になったので、6cm³まではイオンが減り電流は小さくなる。それ以上加えると、加えた Ba²⁺ と OH⁻ が残り、イオンが増えて電流は大きくなる。"], [12, "6(1)", "ウ", "イネ・トウモロコシ・ユリは単子葉類で葉脈は平行脈。アブラナは双子葉類で網状脈。"], [12, "6(2)", "イ", "マツ（裸子植物）は、雄花のりん片の花粉のうから出た花粉が、雌花の胚珠に直接ついて種子ができる。ア：種子になるのは胚珠（子房は果実）。ウ：イチョウは裸子植物で果実はできない。エ：花粉管は柱頭から胚珠へのびる。"], [12, "6(3)", "ウ、オ", "コケ植物は根・茎・葉の区別がなく、根のように見える仮根でからだを固定している（ウ）。胞子でふえ、胞子は湿った地面に落ちて発芽する（オ）。イ：飛ばすのは胞子のうではなく胞子。エ：維管束はない。カ：ひげ根ではなく、乾燥に弱い。"], [12, "6(4)", "x エ、y ウ、z イ", "アサガオは×が x だけ。アサガオは胞子をつくらないので x＝エ（胞子をつくる）。ヘゴ（シダ植物）は○が3つ：光合成・胞子・葉茎根の区別（y＝ウ）で、花粉はつくらない（z＝イ）。ゼニゴケは光合成と胞子の2つで合う。"], [14, "7(1)", "ウ", "炭酸水素ナトリウムを加熱すると二酸化炭素が出る（石灰水が白くにごる）。石灰石にうすい塩酸を加えても二酸化炭素が出る。アは水素、イはアンモニア、エは酸素。"], [14, "7(2)", "Na₂CO₃", "加熱後に残った白い物質は炭酸ナトリウム。2NaHCO₃→Na₂CO₃＋H₂O＋CO₂。水によく溶け、強いアルカリ性。"], [14, "7(3)", "ア", "試験管Aの口を少し下げるのは、発生した水（液体）が加熱部分に流れて試験管が割れるのを防ぐため。"], [14, "7(4)", "2.65 g", "表3より、2.00gを加熱すると最後は1.26gになる。質量の比は一定なので、4.20×1.26/2.00＝2.646 → 2.65g。"], [16, "8(1)", "エ", "図1の恒星O（北極星）を中心に星が回っているので、北の空。"], [16, "8(2)", "ウ", "星の年周運動は地球の公転による。ア：恒星は自分で光る。イ：距離はさまざま。エ：銀河などの集団をつくる。"], [16, "8(3)", "キ", "北の空の星は北極星を中心に反時計回りに、1時間で15°、1か月で30°（同じ時刻）動く。1か月後で1時間おそいので 30°＋15°＝45°。恒星Pから反時計回り（下向き）に45°なので キ。"], [16, "8(4)", "カ", "地球は北極側から見て反時計回り（西から東）に自転するので、地球儀は B の向きに回す。24時間＝86400秒を10秒で再現しているので、時間は 10/86400＝約1/8600 倍。"], [18, "9(1)", "作図（正答表の図を参照）", "A が B を押す力（作用、3N下向き）の反作用は、B が A を押す力。A と B の境目の点を作用点にして、上向きに方眼3目盛り（3N）の矢印をかく。"], [18, "9(2)(a)", "イ", "図2で、はかりPが 800g→700g になるのは糸を10cm引き上げたとき。その間 A は持ち上がっていない（30cmまでは目盛りが下がり続ける）ので、ばねの伸びは引き上げた距離と同じ 10cm。"], [18, "9(2)(b)", "ア", "30cm引いたとき目盛りが500gで止まるので、ここで A（300g＝3N）が浮く。ばねが A を引く力が仕事をするのは、残りの 10cm だけ。3N×0.1m＝0.3J。"], [18, "9(3)", "(a) イ、(b) エ", "実験1から、ばねは 1N（100g分）で10cm伸びる。20cm伸びたときばねの力は2N。この力は A と B の両方を上に引くので、はかりP＝300−200＝100g、はかりQ＝500−200＝300g。"]], "2026_social": [[2, "1(1)", "ア", "縄文時代につくられたのは土偶（ア）。イは弥生時代の銅鐸、ウは古墳時代の埴輪、エは中国の殷の青銅器など。"], [2, "1(2)", "ウ", "資料1は四国の太平洋側など海岸線に沿って分布し、地図記号は「自然災害伝承碑」。資料2は高知市の津波避難タワー。共通するのは津波。"], [3, "1(3)", "イ", "世界遺産条約を採択し、教育・科学・文化の協力を通じて平和をめざす国連の専門機関は UNESCO（国連教育科学文化機関）。WTO は世界貿易機関、WHO は世界保健機関。"], [3, "1(4)", "ウ", "仙台七夕まつりの来客数 203.6万人は、青森ねぶた祭 98万人の2倍（196万人）以上。経済効果は青森 306億円＞仙台 195億円。ア：秋田竿燈は122万人で94億円。イ：盛岡さんさは青森より少ない。エ：秋田の経済効果94億円は福島28億円の5倍未満。オ：山形の減少は約28万人。"], [4, "2(1)", "エ", "天平文化（奈良時代）は、聖武天皇が伝染病や災害から国を守ろうとした東大寺の大仏（エ）。アは飛鳥時代の広隆寺の弥勒菩薩、イは飛鳥文化の仏像、ウは平安時代の平等院鳳凰堂の阿弥陀如来像（国風文化）。"], [5, "2(2)", "ウ", "源頼朝は、対立した弟の源義経をとらえることを口実に、国ごとに守護、荘園や公領ごとに地頭を置くことを朝廷に認めさせた（1185年）。六波羅探題は承久の乱の後に置かれた。"], [5, "2(3)", "ア", "南蛮貿易では、日本からは主に銀が持ち出された。鉄砲・火薬・ガラス製品などは日本に入ってきたもの。"], [5, "2(4)", "（例）営業を独占する株仲間を認める代わりに税", "田沼意次は、商人の同業者組合である株仲間を認めて営業の独占を許し、その代わりに税（営業税）を納めさせた。「独占」「株仲間」の2語を必ず入れる。"], [5, "2(5)", "イ", "開国後の物価上昇などの混乱の中、民衆は「世直し」を期待して一揆や打ちこわしを起こした。「ええじゃないか」の騒ぎも起きた。15代将軍徳川慶喜は政権を朝廷に返す大政奉還を行った（1867年）。版籍奉還は明治政府が土地と人民を天皇に返させたもの。"], [6, "3(1)", "ウ", "国際連盟は1920年に成立。1912年（中華民国成立）〜1941年（日ソ中立条約）の期間に含まれる。"], [7, "3(2)", "ア", "日清戦争（1894年）のきっかけは、朝鮮で起きた甲午農民戦争。朝鮮政府が清に援軍を求め、日本も出兵して両国が対立した。イは日中戦争、ウはアヘン戦争、エは義和団事件。"], [7, "3(3)", "Ⅰ イ、Ⅱ ウ", "米騒動の責任をとって寺内内閣が退陣すると、立憲政友会の原敬が首相となり、大部分の閣僚を政党の党員が占める本格的な政党内閣ができた（1918年）。"], [7, "3(4)", "エ→ア→イ→ウ", "エ：ペリー来航（1853年）→ア：南北戦争（1861年）→イ：アメリカの第一次世界大戦参戦（1917年）→ウ：ワシントン会議（1921〜22年）。"], [7, "3(5)", "エ", "日本人初のノーベル賞（物理学賞）は湯川秀樹（1949年）。佐藤栄作は平和賞、川端康成と大江健三郎は文学賞。"], [8, "4(1)", "Ⅰ ア、Ⅱ ウ、Ⅲ イ", "緯度は南北それぞれ90度、経度は東西それぞれ180度まで。正反対（対せき点）は、緯度は北と南を入れかえ同じ数値、経度は 180−30＝150 で東西を入れかえる。北緯30度・東経30度 → 南緯30度・西経150度。"], [8, "4(2)", "都市 B、自然 ア", "年平均気温が−10.1℃で、夏の短い間だけ気温が0℃を少しこえる寒帯（ツンドラ気候）。北極海に近い B の都市。夏の間だけ地表がとけて、こけ類が育つ。"], [9, "4(3)", "ウ", "19世紀以降、鉄鋼や自動車工業は五大湖周辺（地図中の あ）で発展した。20世紀後半からはサンベルトで先端技術産業が発展し、特にサンフランシスコ近くのシリコンバレー（い の付近）にICT関連企業が集まっている。"], [9, "4(4)", "プランテーション", "植民地時代に開かれた、輸出用の作物を大規模に栽培する大農園。Yはケニアで、茶の栽培がさかん。"], [9, "4(5)", "ウ", "2010年のGDP上位2か国は日本とドイツ。どちらもエネルギー国内供給量は減っている。ア：日本は人口が減少。イ：出生率が高い順（インド→メキシコ→ドイツ→日本）と増加額の順は一致しない。エ：ドイツは人口が増えたが出生率8.5で10未満。"], [10, "5(1)", "イ", "瀬戸内は中国山地と四国山地にはさまれ、太平洋や日本海から吹く湿った季節風がさえぎられるため、雨が少ない。そのため讃岐平野では、水不足に備えたため池が多い。マングローブは熱帯の海岸の林。"], [10, "5(2)", "エ", "九州南部には、火山の噴出物が厚く積もったシラス台地が広がる。シラスは水を通しやすく、水をたくわえにくいので、水の確保が難しかった。ロームは関東地方に広がる火山灰の赤土。"], [10, "5(3)", "（例）地価が高いため、土地を有効利用する", "都心は地価が高いので、限られた土地を有効に使うために高層ビルが建てられる。「地価」「利用」の2語を入れて20字以内。"], [11, "5(4)", "ウ、オ", "ウ：新屋敷町付近に裁判所（Ⅹ）や消防署、市役所などの記号が集まっている。オ：縮尺2万5千分の1で約9cmなので、9×25000＝225000cm＝2.25km。ア：紀伊田辺駅は紀伊新庄駅から見て北西。イ：南新町・北新町付近に多いのは神社（⛩）ではなく寺院（卍）の記号。エ：A・B間の点線は道（小道）で、周囲より標高が低い位置を結んだ線ではない（等高線で確かめる）。"], [12, "5(5)", "イ", "地形図では、高等学校の地図記号（⊗）と小・中学校（文）は区別されているので、資料1でも高等学校かどうか判別できる。よってイが誤り。"], [13, "6(1)", "C", "Ⅳは「海外向け」で「個人的な取り組み」。フェアトレード商品の購入やNGOのボランティアは、個人が海外を支援する取り組み。Aは国内・個人、Bは国内・公的、Dは海外・公的。"], [13, "6(2)", "オ", "4つの略称は PKO（平和維持活動）、NPT（核拡散防止条約）、ODA（政府開発援助）、UNHCR（国連難民高等弁務官事務所）。どれにも使われない文字は Y。"], [15, "7(1)", "オ", "消費税は、税率が8%から10%に上がり（2019年）軽減税率がある資料2で、グラフでは1989年に始まり急に増えた Y。所得税は、収入が多いほど税率が高くなる累進課税の資料1で、長く最大の税収だった X。資料3は相続税で Z。"], [15, "7(2)", "エ", "A：電気・ガス・水道などの公共料金は、国や地方公共団体が決定・認可する（公正取引委員会ではない）ので誤り。B：クーリング・オフは訪問販売など特定の取引だけが対象で、全ての契約ではないので誤り。"], [15, "7(3)", "ウ", "「効率」（むだがない）と「公正」（関係者の立場や意見の公平さ）の両方を考えた方法。混雑状況の発信で観光客を分散させ、入場料の一部を環境保全に使うのは、住民と観光客の両方に配慮している。ア：むだが多い。イ：住民だけを優先。エ：優劣を決めるのは合意にならない。"], [16, "8(1)", "ウ", "大日本帝国憲法では主権は天皇にあった。絵は言論を取りしまる様子なので、実現していないのは表現の自由（日本国憲法第21条）。"], [16, "8(2)", "（例）立法権、行政権、司法権が互いに抑制し合い、均衡", "国会（立法権）、内閣（行政権）、裁判所（司法権）が互いに抑制し合い、均衡を保つことで、権力の集中や乱用を防ぐ。"], [17, "8(3)", "オ", "国の政策は全国的な規模の施策を担う（ろ）で、事例は法律の改正（事例B）。地方自治体の政策は住民自治に基づき住民の自発的努力が大切（い）で、事例は地域の高齢者の見守り（事例A）。「は」はNPOの説明。"]]};

let y=null,sb=null,mode=1,sp=0,Z=1;const LD={};
function load(f){return LD[f]||(LD[f]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=f+'.js?v=2611271755';s.onload=res;s.onerror=()=>{delete LD[f];rej()};document.head.appendChild(s)}))}
YS.forEach(k=>{const b=document.createElement('button');b.className='Y';b.innerHTML=k+'<br><small>'+M[k].w.replace('令和','R')+'</small>';b.style.lineHeight='1.1';b.dataset.k=k;b.onclick=()=>pick(k,null);$('ry').appendChild(b)});
SUB.forEach(([k,l])=>{const b=document.createElement('button');b.className=k;b.textContent=l;b.dataset.k=k;b.onclick=()=>pick(null,k);$('rb').appendChild(b)});
function pick(a,b){if(a)y=a;if(b)sb=b;sp=0;$('xp').style.display='none';render(true)}
function ttl(){return M[y].w+'年度（'+y+'）'+SUB.find(x=>x[0]==sb)[1].replace(/^[^一-龠]+/,'')}
async function render(scroll){
 document.querySelectorAll('#ry button').forEach(b=>b.classList.toggle('on',b.dataset.k==y));
 document.querySelectorAll('#rb button').forEach(b=>b.classList.toggle('on',b.dataset.k==sb));
 if(y){$('pdfrow').style.display='';$('pdfa').href='chiba_kakomon_set_'+y+'.pdf';$('pdfa').textContent='🖨 '+M[y].w+'年度の印刷用カコモンセット（PDF）'}
 if(!y||!sb)return;
 const rd=$('rd');rd.style.display='flex';$('msg').style.display='none';rd.className=sb;
 const key=y+'_'+sb;$('col').innerHTML="<p id='tt'>読み込み中…</p>";$('sp').innerHTML='';
 try{await load(key)}catch(_){$('col').innerHTML='<p id="tt">読み込みに失敗しました</p>';return}
 if(key!=y+'_'+sb)return;
 $('m1').classList.toggle('on',mode==1);$('m2').classList.toggle('on',mode==2);
 draw();if(scroll)rd.scrollIntoView();
}
function P(){return IMG[y+'_'+sb]}
const ansBtn="<button class='hi' onclick='showAns()'>✏️ 正答表・解答用紙を見る</button>";
function draw(){
 const p=P(),L=p.length;
 if(mode==1){$('col').style.display='';$('sp').style.display='none';$('pgr').style.display='none';
  $('col').innerHTML="<p id='tt'>"+ttl()+"（全"+L+"ページ）</p>"+p.map((s,i)=>"<div class='pw'><p class='pn'>"+(i+1)+" / "+L+"</p><img loading='lazy' src='"+s+"'>"+qb(i+1)+"</div>").join('')+"<div class='end'>"+ansBtn+"</div>";
 }else{$('col').style.display='none';$('sp').style.display='flex';$('pgr').style.display='flex';
  const n=Math.floor(L/2)+1;sp=Math.max(0,Math.min(sp,n-1));
  let a=sp==0?-1:2*sp-1,b=sp==0?0:2*sp;if(a>=L)a=-1;if(b>=L)b=-1;
  const rtl=sb=='japanese';let l=rtl?b:a,r=rtl?a:b;if(sp==0){l=rtl?-1:-1;r=0}
  const slot=(i,c)=>"<div class='sl "+c+"'>"+(i<0?"":"<img src='"+p[i]+"'>")+"</div>";
  $('sp').innerHTML=slot(l,'L')+slot(r,'R');
  const nums=[a,b].filter(x=>x>=0).map(x=>x+1).join('・');
  $('pgr').innerHTML="<div class='r1'>"+ttl()+"　"+nums+" / 全"+L+"ページ</div><div class='r2'><button class='ctl' id='pv'>"+(rtl?"次へ ◀":"◀ 前へ")+"</button><button class='ctl' id='nx'>"+(rtl?"▶ 前へ":"次へ ▶")+"</button>"+(sp==n-1?ansBtn:"")+"</div>"+[a,b].filter(x=>x>=0).map(x=>qb(x+1)).join('');
  $('pv').onclick=()=>{sp+=rtl?1:-1;draw()};$('nx').onclick=()=>{sp+=rtl?-1:1;draw()};
 }
}
async function showAns(){
 $('rd').style.display='none';const x=$('xp');x.style.display='block';x.className=sb;
 x.innerHTML="<div class='xbar'><button class='xb' onclick='back()'>◀ 問題にもどる</button><span class='xt'>"+ttl()+" 答え</span><span class='zm'>拡大<button class='ctl' onclick='zoom(-.25)'>−</button><button class='ctl' onclick='zoom(.25)'>＋</button></span></div><div class='xin'><p class='lg'>読み込み中…</p></div>";
 x.scrollIntoView();const key=y+'_'+sb;
 try{await load('a_'+key)}catch(_){x.querySelector('.xin').innerHTML='<p class="lg">読み込みに失敗しました</p>';return}
 const A=IMG[key+'_ans']||[],S=IMG[key+'_sheet']||[];
 const kx=K[key]||[];let h=(kx.length?"<h2 class='xh'>💡 設問ごとの答えと解説</h2>"+kx.map(r=>"<div class='it'><div class='q'>"+esc(r[1])+"</div><div class='a'>答え："+esc(r[2])+"</div><div class='e'>"+esc(r[3])+"</div></div>").join(''):'')+"<h2 class='xh'>✏️ 正答表（配点・採点上の注意つき）</h2><div class='aw'>"+A.map(u=>"<img class='ai' src='"+u+"'>").join('')+"</div>";
 h+="<h2 class='xh'>📝 解答用紙</h2>"+(S.length?"<p class='lg'>印刷して使うときは、上の「印刷用カコモンセット（PDF）」が便利です。</p><div class='aw'>"+S.map(u=>"<img class='ai' src='"+u+"'>").join('')+"</div>":"<p class='lg'>この年度は解答用紙の原本がありません。ノートに解答してください。</p>");
 h+="<p class='note'>※千葉県教育委員会公表の問題・正答表をもとにしています。</p><div style='text-align:center'><button class='xb' onclick='back()'>◀ 問題にもどる</button></div>";
 x.querySelector('.xin').innerHTML=h;zoom(0);
}
function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function qb(pg){const kx=(K[y+'_'+sb]||[]);const L=kx.map((r,i)=>[r,i]).filter(([r])=>r[0]==pg);if(!L.length)return '';return "<div class='qbs'><span>💡答え・解説</span>"+L.map(([r,i])=>"<button class='qbb' data-i='"+i+"' onclick='openQ("+i+")'>"+esc(r[1])+"</button>").join('')+"</div>"}
function openQ(i){const r=K[y+'_'+sb][i];document.querySelectorAll('.qbb').forEach(b=>b.classList.toggle('on',+b.dataset.i==i));$('qx').className=sb;$('qx').style.display='flex';$('qxt').textContent=r[1];$('qxb').innerHTML="<div class='a'>答え："+esc(r[2])+"</div><div class='e'>"+esc(r[3])+"</div>";document.body.classList.add('qo')}
function closeQ(){$('qx').style.display='none';document.body.classList.remove('qo');document.querySelectorAll('.qbb').forEach(b=>b.classList.remove('on'))}
function zoom(d){Z=Math.max(1,Math.min(3,Z+d));$('xp').style.setProperty('--z',Z)}
function back(){$('xp').style.display='none';$('rd').style.display='flex';$('rd').scrollIntoView()}
$('ga').onclick=showAns;
$('m1').onclick=()=>{mode=1;render()};$('m2').onclick=()=>{mode=2;sp=0;render()};
$('bk').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.addEventListener('keydown',e=>{if(mode!=2||!y||!sb||$('rd').style.display=='none')return;const r=sb=='japanese';if(e.key=='ArrowRight'){sp+=r?-1:1;draw()}if(e.key=='ArrowLeft'){sp+=r?1:-1;draw()}});
let tx=null;$('sp').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('sp').addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)<60)return;const r=sb=='japanese';sp+=(d<0)!==r?1:-1;draw()});
</script></body></html>
